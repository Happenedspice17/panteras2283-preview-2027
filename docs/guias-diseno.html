en el CAD con el mecanismo en todas sus posiciones).\n9. **Protección contra virutas:** limpia todo antes de energizar; cubre el panel (policarbonato) para evitar virutas metálicas y tornillos caídos sobre las terminales **[Buena práctica]**.\n10. **Sujeción:** tornillería (tuerca y perno) o zip ties; Dual Lock solo no basta en choques **[Fabricante]**. Amortigua radio y coprocesadores con espuma/aisladores.\n11. **Baterías:** a un costado, bajas, con correa, ventilación libre y cambio rápido (sin quitar mecanismos) **[FIRST]** (R601-G, R606 2026).\n12. **Pre-cablea el panel fuera del robot**, es mucho más fácil que dentro **[Fabricante]**.\n13. **Etiqueta** todo: canal del PD, ID CAN, FROM/TO **[Buena práctica]**.\n\n---\n\n## 10. Sensores comunes y cómo cablearlos\n\n| Sensor | Conexión | Notas |\n|---|---|---|\n| **Encoder integrado del motor** (NEO, Kraken) | Cable del propio controlador/motor | Lo más simple; no lo cortes |\n| **Encoder absoluto CAN** (CANcoder) | Cadena CAN + 12V de un canal pequeño del PD (10A) | Necesario para swerve; ID único |\n| **Encoder absoluto PWM/DIO** (Through Bore) | Puerto DIO/Absolute del controlador o roboRIO | Cable corto, con strain relief |\n| **Limit switch / sensor de haz** | DIO (señal + tierra) al controlador o roboRIO | Usa normalmente cerrado para detectar cable roto (falla segura) **[Buena práctica]** |\n| **Gyro / IMU** (Pigeon 2.0, navX) | Pigeon 2.0 por CAN (22 AWG integrado) con su alimentación; navX por MXP/USB | Móntalo plano, rígido y en el centro del robot |\n| **Cámaras / Limelight** | Ethernet CAT5e+ al puerto AUX del radio + alimentación (12V, breaker 20A) | Quita tensión del cable y amortigua |\n\n- **[FIRST]** Los circuitos personalizados y sensores **no pueden alterar** la ruta de potencia batería-PD-controlador-motor (R625 2026); no exceden 24V (R614 2026), salvo inyectores PoE COTS.\n- Con SystemCore (2027) cambian puertos y librerías (CANPort, SPI eliminado); no cablees sensores SPI hoy si piensas migrar.\n- **[Buena práctica]** Alimentación de sensores con fusible de 10A; empalma varios sensores del mismo canal con WAGO 221 en Y.\n\n---\n\n## 11. Errores comunes (brownouts y desconexiones)\n\n| Problema | Síntoma | Qué revisar |\n|---|---|---|\n| **Cables flojos** (batería, main breaker, PD, roboRIO) | Reinicios, apagones al chocar | Tirón de prueba; terminales de tornillo bien apretadas (no se giran a mano) |\n| **Conector SB50 sin asegurar** | Robot muerto tras un golpe | Clip o zip tie al SB50 |\n| **Radio**: Ethernet/PoE flojos, radio sin amortiguar | Desconexiones del Driver Station | Cable PoE bien asentado; alimentación redundante; revisa conectores RJ45 |\n| **CAN roto o mal terminado** | Motores que se apagan, dispositivos \"perdidos\" | Continuidad amarillo/verde; terminación (120 Ω entre CAN-H y CAN-L ≈ 60 Ω medido en el bus) |\n| **Batería débil o vieja** | Brownout en match | Analizador de resistencia interna; rota y retira |\n| **Cables delgados o largos** en motores de 40A | Caída de voltaje, brownouts | Calibre correcto y rutas cortas |\n| **Mala crimpa / cable con hilos sueltos** | Fallas intermitentes | Rehaz el crimp; tirón de prueba |\n| **Cable atrapado en mecanismo** | Corto, cable cortado | Ruta con holgura; revisar a todo recorrido |\n| **Breaker disparado por atoramiento** | Motor se detiene | Revisa mecanismo antes de cambiar el breaker |\n| **Revisión solo antes del evento** | Aflojamientos acumulados | Revisión de conexiones tras los primeros partidos |\n\n**Re-chequeos [Fabricante]:** terminales rotativos (batería, PD) cada 1-3 partidos; conexiones de resorte (WAGO/Weidmuller) cada evento. Revisa los logs del Driver Station tras cada partido (voltaje de batería, corriente).\n\n---\n\n## 12. Checklist antes de inspección\n\n**Batería y potencia**\n- [ ] Batería única 12V 17-18.2 Ah, sujeta, con ventilación libre, etiquetada, probada\n- [ ] Todas las conexiones de batería aisladas; SB50 asegurado\n- [ ] Main breaker 120A accesible y visible, con cable 6 AWG (o más grueso) a la PD\n- [ ] Un solo PD; breakers y cableado visibles\n- [ ] Breakers/fusibles de modelos permitidos y bien asentados\n\n**Cableado**\n- [ ] 40A con 12 AWG mínimo; 30A con 14 AWG; 20A con 18 AWG; \u003c= 5A/fusible 10A con 22 AWG (Tabla 8-4, R622)\n- [ ] Colores: positivo rojo/amarillo/blanco/café/negro con raya; negativo negro o azul\n- [ ] Un cable por terminal del PD (R618); un cable por WAGO (buena práctica); sin hilos sueltos; tirón de prueba hecho\n- [ ] Cables protegidos en bordes, con alivio de tensión y lejos de piezas móviles\n- [ ] Todo etiquetado y documentado\n\n**Control y red**\n- [ ] roboRIO (o controlador 2027) alimentado directo del PD con 10A\n- [ ] Radio VH-109 con LEDs visibles, conectado a puerto RIO, programado para el evento\n- [ ] RSL visible a 36 in y destellando junto con el roboRIO\n- [ ] CAN en cadena, terminación correcta, IDs únicos y anotados\n\n**Chasis**\n- [ ] Prueba de aislamiento: > 120 Ω entre postes del PD y la frame\n- [ ] Panel protegido contra virutas y bien sujeto\n- [ ] Robot probado sobre bloques\n\n**Verificación final**\n- [ ] Revisamos las reglas contra el **Manual vigente (FRC 2026)**\n\n---\n\n## Fuentes\n- Manual del Juego FRC 2026, sección 8 (R6xx, R7xx; vigente)\n- Lista de inspección FRC 2026 Rev. 0: https://firstfrc.blob.core.windows.net/frc2026/Manual/2026FRCInspectionChecklist.pdf\n- WPILib, Introduction to FRC Robot Wiring: https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-1/basic-robot-wiring.html\n- WPILib, How to Wire (kitbot) / intro wiring: https://docs.wpilib.org/en/stable/docs/zero-to-robot/step-1/intro-to-frc-robot-wiring.html\n- WPILib, Wiring Best Practices: https://docs.wpilib.org/en/latest/docs/hardware/hardware-basics/wiring-best-practices.html\n- WPILib, CAN Wiring Basics: https://docs.wpilib.org/en/stable/docs/hardware/hardware-basics/can-wiring-basics.html\n- WPILib, CAN addressing: https://docs.wpilib.org/en/stable/docs/software/can-devices/can-addressing.html\n- WPILib, New for 2027 (Systemcore): https://docs.wpilib.org/en/latest/docs/yearly-overview/yearly-changelog.html\n- WPILib, Systemcore Introduction: https://docs.wpilib.org/en/latest/_sources/docs/software/systemcore-info/systemcore-introduction.rst.txt\n- WPILib SystemcoreTesting (alfa): https://github.com/wpilibsuite/SystemcoreTesting\n- CTR Electronics, CANivore Intro: https://v6.docs.ctr-electronics.com/en/stable/docs/canivore/canivore-intro.html\n- Wiring Cheat Sheet, equipo 3255 (secundaria, no oficial): https://frcteam3255.github.io/Wiki/Electrical/Wiring%20Cheat%20Sheet\n"},{"id":"motores-controladores","title":"Motores, controladores y sensores","md":"# Motores, controladores y sensores\n\nGuía para elegir motor, controlador, reducción y sensor de cada mecanismo del robot, y configurar límites de corriente y modo brake/coast.\n\n> **Manual vigente: FRC 2026.** Las reglas [FIRST] citan el manual 2026; al salir el de 2027 (9 ene 2027) se actualizan y solo cuenta el vigente. Detalle completo en reglas-frc.md.\n\n**Tipos de viñeta:** **[FIRST]** = requisito del manual · **[Fabricante]** = recomendación del fabricante · **[Buena práctica]** = práctica común de equipos FRC.\n\n---\n\n## 1. Resumen rápido\n\n- **[Buena práctica]** Para casi todo lo nuevo: **Kraken X60** (potencia alta), **Kraken X44 / Minion** (mecanismos medianos) y **NEO / NEO Vortex / NEO 550** si el equipo ya tiene ecosistema REV (SPARK MAX/Flex).\n- **[Fabricante]** El Kraken trae su controlador (Talon FX) integrado. El Minion se controla con **Talon FXS**. El NEO y NEO 550 van con **SPARK MAX** (o Flex); el NEO Vortex va con **SPARK Flex**.\n- **Nunca** conectes un motor brushless a un controlador que solo maneja brushed ni al revés (ver sección 3).\n- **[FIRST]** (R501, R504 2026) Solo se pueden usar los motores de la Tabla 8-1 y los controladores de R504 (lista completa en la sección 2.1). Kraken X60/X44, Minion, Falcon 500, NEO, NEO Vortex, NEO 550, CIM, Mini CIM, BAG y 775 Pro son todos legales en 2026, en cualquier cantidad (salvo los 4 motores de propulsión, R502).\n\n---\n\n## 2. Tabla de motores\n\nValores a 12 V del fabricante (Kraken con conmutación trapezoidal salvo que se indique). **Free speed** = RPM sin carga. Usa estos números en ReCalc o en el simulador de WPILib.\n\n| Motor | Tipo | Free speed (RPM) | Stall torque (N·m) | Stall current (A) | Peso | Controlador | Eje / interfaz |\n|---|---|---|---|---|---|---|---|\n| **Kraken X60** (WCP / CTRE) | Brushless, Talon FX integrado | 6,000 | 7.09 | 366 | ~1.2 lb (≈0.54 kg)* | Integrado (Talon FX) | SplineXS (no reemplazable) |\n| Kraken X60 en modo FOC (requiere Phoenix Pro) | igual | 5,800 | 9.37 | 483 | igual | Integrado | SplineXS |\n| **Kraken X44** (WCP / CTRE) | Brushless, Talon FX integrado | 7,758 | 4.11 | 279 | ~0.75 lb (≈0.34 kg)* | Integrado (Talon FX) | SplineXS (mismo boss y largo que X60) |\n| Kraken X44 en modo FOC | igual | 7,368 | 5.01 | 329 | igual | Integrado | SplineXS |\n| **Minion** (CTRE) | Brushless, **sin** controlador | ≈7,000 a 7,384 (preliminar, varía según la fuente) | 3.1 | **verificar en ficha CTRE** | 0.65 lb (≈0.29 kg) | **Talon FXS** | SplineXS; 1.5 in de diámetro x 2.85 in de largo |\n| **NEO v1.1** (REV) | Brushless con hall sensors | 5,820 (5,676 en la ficha de producto) | 3.0 (2.6 en la ficha) | 160 (105 en la ficha) | 0.938 lb (0.425 kg) | SPARK MAX o SPARK Flex | Eje 8 mm con cuña (keyed), 35 mm de largo |\n| **NEO Vortex** (REV) | Brushless, hall, eje pasante | 6,784 | 3.6 | 211 | 0.99 lb (447 g) | **SPARK Flex** (directo) o SPARK MAX con adaptador *Vortex Solo Adapter* | Hex 1/2 in pasante, cónico; acepta ejes especiales (8 mm keyed, spline tipo Falcon, MAXSwerve, MAXPlanetary) |\n| **NEO 550** (REV) | Brushless, chico | 11,000 | 0.97 | 100 | 0.313 lb (0.142 kg) | SPARK MAX | Eje 0.125 in (3.175 mm) |\n| **Falcon 500** (VEX/CTRE) (legal 2026, R501) | Brushless, Talon FX integrado | 6,380 | 4.69 | 257 | ~1.1 lb* | Integrado (Talon FX) | Spline (Falcon) |\n| **CIM** (legacy) | **Brushed** | 5,310 | 2.425 | 131 | ~2.8 lb* | Talon SRX / Victor SPX / SPARK MAX (modo brushed) | Eje 8 mm con cuña (keyed)... confirmar en ficha |\n| **Mini CIM** (legacy) | Brushed | 5,840 | 1.41 | 89 | ~2.16 lb* | igual | confirmar en ficha |\n| **BAG** (legacy) | Brushed | 13,180 | 0.43 | 53 | ~0.71 lb* | igual | confirmar en ficha |\n| **775pro** (legacy; legal 2026 como WCP RS775 Pro, Banebots RS775 y Thrifty Pulsar 775) | Brushed | **no verificado** | no verificado | no verificado | no verificado | igual | no verificado |\n\n\\* Peso tomado de una wiki de equipo (FRC 3255), no del fabricante; úsalo como aproximación y pesa el motor real.\n\n**Notas**\n\n- **[FIRST]** (R501 2026) La legalidad de cada motor está en la Tabla 8-1 (sección 2.1). Los motores no se limitan en cantidad, salvo los de propulsión (R502).\n- **Falcon 500:** es legal en 2026 (R501: P/N 217-6515, am-6515, am-6515_Short), aunque CTRE lo dejó de vender y la tienda lo muestra sin existencias. Para diseño nuevo, elige Kraken.\n- **Minion:** CTRE publica dos free speed distintos (7,000 en la tabla preliminar, 7,384 en la sección sin FOC). Revisa la ficha vigente. Stall current no lo pude verificar.\n- **Kraken X44:** WCP publicó valores preliminares anteriores (7,530 RPM, 4.05 N·m, 275 A). Los de la tabla son los de la documentación actual de WCP. CTRE mantiene datos de dinamómetro actualizados en su *Motor Testing Lab*.\n- **NEO v1.1:** la documentación de REV muestra dos juegos de datos (comparativa: 5,820 RPM / 3.0 N·m / 160 A; ficha de producto: 5,676 / 2.6 / 105). Para cálculos usa la comparativa más reciente y deja margen.\n- **CIM, mini CIM, BAG:** valores de una wiki de equipo (FRC 3255); no los contrasté con la ficha de AndyMark/VEX. Confirma que la legalidad y la interfaz de eje.\n- **Stall** (motor trabado) es un límite teórico: nunca diseñes para operar ahí. Sirve para dimensionar fusibles y límites de corriente.\n\n### 2.1 Motores legales según el manual FRC 2026\n\n**[FIRST]** (R501, Tabla 8-1 2026) Motores y actuadores permitidos, en cualquier cantidad:\n\n- AndyMark 9015, NeveRest, PG, RedLine, Snow Blower.\n- Banebots (M5 RS550, M7 RS775-18, RS775WC-8514, RS550 y variantes del manual).\n- CIM (todas las variantes del manual), VEX BAG, VEX Mini-CIM, y los motores automotrices actuales o pasados del KOP (Denso, Bosch, Johnson Electric del manual).\n- CTR Electronics Minion; CTR/VEX Falcon 500; West Coast Products Kraken X44 (WCP-0941) y Kraken X60 (WCP-0940, am-5274); WCP RS775 Pro.\n- Playing With Fusion Venom; ThriftyBot Pulsar 775.\n- REV HD Hex, REV NEO Brushless, REV NEO 550, REV NEO Vortex.\n- Ventiladores \u003c= 120 mm y \u003c= 10 W a 12 V; motores de discos duros y de vibración/autofoco de dispositivos de cómputo COTS legales; motores integrales de sensores COTS.\n- Servos PWM COTS rotativos (stall \u003c= 4 A y potencia mecánica \u003c= 8 W a 6 V) y lineales (stall \u003c= 1 A a 6 V).\n- 1 compresor conforme a R806.\n- Cualquier motor brushed COTS, actuador lineal, solenoide o electroimán de 12 V cableado a un dispositivo regulador aprobado tras un breaker de 20 A o menos (solenoides a 24 V deben estar clasificados para 24 V).\n\n**[FIRST]** Máximo **4 motores de propulsión** (R502; no cuentan los de dirección swerve, mecanismos o cambios de velocidad). **[FIRST]** No se modifica la parte eléctrica ni mecánica interna del motor; solo soportes y eje de salida, cables (acortar, conectores), eliminar los tornillos #10-32 del Falcon/Kraken X60 y reparaciones que mantengan el desempeño (R503).\n\n**[FIRST]** Controladores permitidos (R504 2026): Koors40 (am-5600), SPARK Flex, SPARK, SPARK MAX, Talon FX (solo para su Falcon/Kraken integral), Talon FXS, Talon, Talon SRX, Thrifty Nova, Venom (solo su motor integral), Victor SP y Victor SPX; relés Spike y Automation Direct; Pneumatics Control Module y Pneumatic Hub; Servo Hub (REV-11-1855). Los servos solo van al roboRIO, a la Spartan Sensor Board, al Servo Power Module o al Servo Hub (R506).\n\n---\n\n## 3. Controladores\n\n| Controlador | Para qué motores | Notas |\n|---|---|---|\n| **Talon FX (integrado)** | Kraken X60, Kraken X44, Falcon 500 | Controlador dentro del motor. CAN (y PWM con detección automática en Kraken). 1 kHz de PID en el motor. Voltaje de operación 6 a 24 V (ficha). FOC solo con licencia Phoenix Pro. |\n| **Talon FXS** | **Minion** y \"una amplia gama de motores brushed y brushless de terceros\" (CTRE) | CAN FD, detección automática PWM/CAN, protección de polaridad inversa, soporte de hall avanzado con Phoenix Pro. Límites de corriente exactos: ver la guía del usuario de CTRE. |\n| **SPARK MAX** (REV) | NEO, NEO 550, motores brushed 12 V y brushless con sensores | Tensión de operación 5.5 a 24 V (máx. absoluto 30 V). Corriente continua 60 A, pico 100 A por 2 s. |\n| **SPARK Flex** (REV) | NEO Vortex (se acopla directo); NEO y otros con adaptador | CAN y PWM, USB-C. Brushed solo mediante adaptador. |\n| **Victor SPX / Talon SRX** (CTRE, legacy) | Motores **brushed** (CIM, mini CIM, BAG, 775pro) | Solo para motores heredados. No sirven para brushless de FRC. |\n\n### Brushed vs brushless (seguridad del equipo)\n\n- **[Fabricante]** Un motor **brushless** tiene tres fases y necesita un controlador brushless configurado para ese motor. Un motor **brushed** tiene dos cables.\n- **Nunca** conectes un brushless (NEO, Vortex, Minion, 550...) a un controlador brushed-only (Victor SPX, Talon SRX) ni configures un brushed como brushless. Se dañan el motor o el controlador.\n- **[Fabricante]** En SPARK MAX/Flex el **tipo de motor** se configura en el controlador (NEO/NEO 550: *REV NEO Brushless* con sensor *Hall Effect*; brushed: *Brushed*). Verifica el LED y el tipo de motor antes de dar potencia.\n- **[Buena práctica]** Prueba con el robot **sobre bloques (ruedas en el aire)** y con el área despejada la primera vez que energizas un motor nuevo. Mano lejos de mecanismos.\n- **[FIRST]** (R505, R621, R622 2026) Cada controlador de motor maneja una sola carga (hasta 2 por controlador para 9015, BAG, PG, NeveRest, Snow Blower, HD Hex, motores KOP y otros brushed); breaker de hasta 40A por controlador y calibre según la Tabla 8-4 (12 AWG para 31-40A, 14 AWG para 21-30A, 18 AWG para 6-20A). Ver también *Wiring the FRC Control System* en docs.wpilib.org.\n\n---\n\n## 4. Qué motor por aplicación\n\nRegla general **[Buena práctica]**: empieza por la carga (peso, fuerza, velocidad deseada) y calcula con ReCalc; el motor sale de ahí, no al revés.\n\n| Mecanismo | Motor típico | Por qué / detalles |\n|---|---|---|\n| **Drivetrain tanque / West Coast** | 4 a 6 Kraken X60 (o NEO/Vortex), 2 o 3 por lado | Alta corriente sostenida; la reducción define la velocidad. |\n| **Swerve, drive** | Kraken X60 o NEO Vortex / NEO | Los módulos comerciales ya definen la reducción (tabla abajo). |\n| **Swerve, steer (azimut)** | Kraken X44, NEO 550 o Minion según el módulo | Requiere posición precisa y poco torque; los módulos actuales usan motores chicos. |\n| **Elevador** | Kraken X60 o X44, NEO | Torque constante contra gravedad; reducción alta; límite de corriente conservador; **brake**. |\n| **Brazo / pivote** | Kraken X60/X44, Minion, NEO | Encoder absoluto en el eje de salida; reducción alta (a menudo > 50:1), freno o resorte. |\n| **Intake de rodillos** | NEO 550, Minion, Kraken X44 | Bajo torque, velocidad alta; reducción 2:1 a 5:1 típica. Límite de corriente por si se atora una pieza de juego. |\n| **Shooter / flywheel** | Kraken X60, NEO Vortex, X44 | Velocidad alta, inercia grande; control de velocidad con feedforward + PID; modo **coast**. |\n| **Climber** | Kraken X60/X44, NEO | Torque alto y baja velocidad; **brake** obligatorio en la práctica (sostener el peso). |\n| **Torreta** | Minion, Kraken X44, NEO 550 | Posición precisa; encoder absoluto; el cableado no debe enredarse (límites de giro por software). |\n\n> Los \"típicos\" son prácticas comunes, no reglas. Valida con ReCalc y con pruebas.\n\n### Módulos swerve comerciales (relaciones y velocidades)\n\n**[Fabricante]** Consulta la hoja del módulo para free speed exacta con tu motor y rueda.\n\n| Módulo | Relaciones de drive | Paso (steer) | Notas |\n|---|---|---|---|\n| **SDS MK4i** | L1 8.14:1, L2 6.75:1, L3 6.12:1 | 150/7:1 (≈21.43:1) | L2 es la más usada en robots de peso completo; L3 más agresiva (robots ligeros). Un kit opcional de piñón de 16T sube la velocidad ≈14%. |\n| **SDS MK5i** | Tres relaciones (R1, R2, R3) | verificar | No pude confirmar los valores; ver la hoja de SDS/AndyMark. |\n| **WCP Swerve X2 / X2S** | Varias opciones (tablas de WCP) | verificar | Diseñado en torno a Kraken X60 (drive) y X44 (steer). |\n| **REV MAXSwerve (3 in)** | Seleccionable por piñón (12T/13T/14T) y engranes; hay kit de actualización | NEO 550 + UltraPlanetary | Funciona con NEO (y Vortex con eje especial). Peso ≈ 3.8 lb con NEO. |\n| **Thrifty Swerve** | verificar | verificar | Opción económica; no consulté su hoja. |\n\n---\n\n## 5. Elegir la relación de reducción\n\n**Idea:** el motor gira rápido y con poco torque; la reducción cambia velocidad por torque.\n\n1. **Define el objetivo**: velocidad lineal (drivetrain, elevador), tiempo de recorrido (elevador/brazo) o RPM final (shooter/rodillos).\n2. **Calcula con ReCalc** (https://www.reca.lc): ingresa motor, cantidad, reducción, peso/carga y límite de corriente; obtienes velocidad, tiempo de recorrido y corriente.\n3. **Revisa la corriente**: si el mecanismo se mueve con corriente cerca de stall, la reducción es muy baja o la carga muy alta.\n4. **Regla práctica [Buena práctica]**: usa 70% a 85% de la free speed teórica como velocidad real; las pérdidas de eficiencia y la caída de voltaje la reducen.\n5. **Compara velocidad y aceleración**: una reducción muy alta da torque pero tarda; muy baja patina las ruedas o no levanta la carga.\n6. **Margen**: deja 20% a 30% de torque extra para fricción, desalineación y desgaste.\n\n### Límites de corriente: supply vs stator\n\n- **Stator current** = corriente que circula por el motor; proporcional al **torque**. **[Fabricante, CTRE]** Limítala para evitar patinaje de ruedas, daños en topes mecánicos y calentamiento.\n- **Supply current** = corriente que sale de la **batería**. **[Fabricante, CTRE]** Limítala para evitar brownouts y disparo de breakers.\n- **[Fabricante, CTRE]** Configura primero el stator; añade supply solo si hace falta (el stator ya suele evitar brownouts). Supply es más útil en mecanismos de alta inercia (flywheels) o para dejar corriente a otros sistemas.\n- **Cómo hallar el valor [Fabricante]:** sobre alfombra y contra una pared, sube la salida despacio, grafica velocidad y corriente de stator en Tuner X, y fija el límite **por debajo** de donde empiezan a patinar las ruedas. No lo pongas tan bajo que se pierda aceleración.\n- **Ejemplos de CTRE** (no universales): ~70 A de supply en drive swerve y ~30 A en un elevador.\n- **SPARK MAX/Flex [Fabricante, REV]:** el *Smart Current Limit* por defecto es 80 A para cualquier motor; REV sugiere empezar con **40 a 60 A para NEO** y **20 a 40 A para NEO 550**. Un límite fuera de rango puede dañar el motor y no está cubierto por garantía. Guarda los parámetros en la memoria flash (*Persist Parameters*) para que sobrevivan a un reinicio.\n- **Brownout:** el roboRIO deshabilita actuadores por debajo de ~6.3 V (roboRIO 1) o 6.75 V por defecto (roboRIO 2). Antes de apretar límites, revisa batería, conexiones y cableado.\n- **[FIRST]** (R619, R621 2026) Los breakers del PD son VB3-A/AT2-A/MX5/ATO de hasta 40A y un controlador de motor usa hasta 40A (Tabla 8-3). Los límites por software **no sustituyen** al breaker correcto.\n\n### Modo brake vs coast\n\n| Modo | Efecto | Úsalo en |\n|---|---|---|\n| **Brake** | El motor se frena al estar en 0% (cortocircuita fases); resiste moverse | Elevador, brazo, climber, torreta |\n| **Coast** | El motor gira libre | Shooter/flywheel, rodillos, a veces el drive |\n\n- **[Buena práctica]** Brake no es un freno de sostén: bajo carga grande el mecanismo puede ceder. Añade resorte, freno mecánico o control de posición.\n- **[Buena práctica]** Un drive en brake frena más rápido pero aumenta el riesgo de volcar con CG alto; muchos equipos usan coast al conducir y brake en modo disabled/autónomo, o lo ajustan por piloto.\n- **[Buena práctica]** Los modos neutros tienen efecto con el robot habilitado; con el robot deshabilitado no confíes en que el motor sostenga nada.\n\n---\n\n## 6. Reductores, cadenas y bandas\n\n### Reductores (gearboxes)\n\n| Reductor | Proveedor | Notas |\n|---|---|---|\n| **MAXPlanetary** | REV | Etapas de 3:1, 4:1, 5:1 apilables; entrada para NEO/Vortex. |\n| **UltraPlanetary** | REV | Cartuchos 3:1/4:1/5:1; usado en el azimut del MAXSwerve con NEO 550. |\n| **VersaPlanetary** | VEX/AndyMark | Heredado; muchas opciones de relación. |\n| **Reductores Kraken / WCP** | WCP | Engranajes para Kraken; eje SplineXS. Revisa su documentación para opciones de relación. |\n\n- **[Buena práctica]** Verifica compatibilidad de la interfaz de eje (sección 7) antes de comprar la etapa.\n- **[Buena práctica]** Lubrica según el fabricante y respeta el par máximo de salida de cada etapa.\n\n### Cadenas vs bandas\n\n| | Cadena #25 | Cadena #35 | Banda HTD 5 mm | Banda GT2 (3 mm) |\n|---|---|---|---|---|\n| Resistencia | Media | Alta | Media | Media-baja |\n| Peso | Ligera | Más pesada | Muy ligera | Muy ligera |\n| Ruido / mantenimiento | Lubricar | Lubricar | Sin lubricación, silenciosa | Sin lubricación, silenciosa |\n| Tensión | Tensor o distancia fija | Igual | Distancia fija o tensor | Igual |\n| Uso típico | Intakes, brazos, elevadores | Cargas altas (climber) | Intakes, transferencias, torreta | Mecanismos ligeros |\n\n- **[Buena práctica]** **#25** para la mayoría de transmisiones de carga media; **#35** si #25 se rompe o estira por la carga; **banda** donde importe peso y ruido y la distancia entre ejes sea estable.\n- **[Buena práctica]** Las bandas no toleran bien ejes que se flexionan o se alejan; la cadena perdona más. Ambos necesitan tensión correcta.\n- **[Buena práctica]** Calcula la **distancia entre ejes** para que el número de eslabones/dientes sea entero. Usa herramientas de calculadora de cadena/banda de ReCalc o del proveedor.\n- **Seguridad:** cadenas y bandas pueden atrapar dedos; usa guardas y manos fuera del mecanismo al energizar.\n\n---\n\n## 7. Ejes y rodamientos\n\n| Eje | Uso común | Nota |\n|---|---|---|\n| **Hex 1/2 in** | Estándar FRC (REV, AndyMark, VEX, WCP) | Buen torque; fácil de maquinar; huecos hex en engranes y poleas. |\n| **Rounded hex 1/2 in** | Variante con esquinas redondeadas | Se desliza mejor en rodamientos; revisa compatibilidad con tus engranes. |\n| **Hex 3/8 in** | Mecanismos ligeros | Menos torque y rigidez. |\n| **MAXSpline (REV)** | Sistema REV | Interfaz propia de REV; verifica piezas compatibles. |\n| **SplineXS (CTRE/WCP)** | Salida de Kraken X60/X44 y Minion | Bajo juego; no reemplazable en el motor. |\n| **Eje 8 mm con cuña (keyed)** | NEO v1.1 | Usa cuña/pinion según el motor. |\n\n- **[Buena práctica]** Rodamientos en **cada soporte** del eje; no dejes un eje largo apoyado solo en un lado (voladizo) si lleva carga alta.\n- **[Buena práctica]** Para cargas radiales y axiales altas usa rodamientos de bolas con brida o placa de montaje que los retenga; no dependas de que un eje \"se sostenga\" por el motor.\n- **[Buena práctica]** Mide holguras y alineación: dos soportes desalineados atoran el mecanismo y suben la corriente.\n- **[Buena práctica]** Los ejes hex se cortan con herramientas de taller (sierra, torno); es trabajo con **adulto/mentor presente** y protección ocular.\n\n---\n\n## 8. Sensores\n\n### Encoders\n\n| Sensor | Tipo | Notas |\n|---|---|---|\n| **Encoder interno del motor** (Kraken, NEO, Vortex) | **Relativo** (cuenta desde el encendido) | Útil para velocidad y posición relativa; pierde la referencia al apagar. |\n| **CANcoder** (CTRE) | **Absoluto**, CAN | Típico para el ángulo de módulos swerve; memoriza el offset. |\n| **REV Through Bore Encoder** | Absoluto y relativo | Se monta en eje hex; lo lee un SPARK o el roboRIO. Verifica la interfaz exacta en la ficha de REV. |\n\n- **Absoluto vs relativo:** un **relativo** solo cuenta pulsos desde que enciende, por lo que debe \"homearse\" (por ejemplo, contra un tope) al inicio. Un **absoluto** conoce la posición del eje al encender (necesario en pivotes y módulos swerve). Muchos equipos usan los dos: absoluto para inicializar y relativo para el lazo rápido.\n- **[Buena práctica]** Pon el encoder absoluto lo más cerca posible del **eje de salida** del mecanismo, no del motor, para que mida el mecanismo real.\n- **[Buena práctica]** Define **límites de software** (soft limits) y de recorrido para evitar golpear los topes; si el mecanismo tiene límite físico, respáldalo con un sensor.\n\n### Giroscopios (IMU)\n\n- **Pigeon 2.0** (CTRE, CAN) y **navX** (Studica) miden la orientación del robot, para swerve orientado al campo y autónomo. Móntalos **rígidos y planos**, lejos de fuentes de vibración fuerte. Revisa la documentación del fabricante para ejes y calibración.\n\n### Sensores de pieza de juego\n\n- **Beam break / sensor de distancia:** detectan una pieza de juego en el intake o shooter. Un beam break es simple y confiable; los de distancia son sensibles a luz y reflexión. **[Buena práctica]** Pruébalos con la iluminación del evento.\n- **Switches de límite:** para homing y topes. Cablea en normalmente cerrado cuando la seguridad dependa de ellos (si se rompe el cable, el sistema se detiene).\n\n### Cámaras\n\n- **Limelight** y **PhotonVision** (con cámaras compatibles) rastrean AprilTags y objetos para apuntar y localizar el robot. **[Buena práctica]** Monta la cámara rígida, con vista despejada, y calibra. La posición de la cámara respecto al robot debe medirse con cuidado (se alimenta al estimador de pose).\n\n---\n\n## 9. Control (nivel conceptual)\n\nNo es una guía de programación; esto ayuda a que diseño y software hablen el mismo idioma.\n\n- **PID:** corrige el error entre meta y medición. P = proporcional al error, I = acumulado (úsalo poco), D = tasa de cambio. Un buen mecanismo mecánico necesita menos PID.\n- **Feedforward:** estima el voltaje necesario según el modelo (gravedad, fricción, velocidad). Mejora mucho el seguimiento y reduce el trabajo del PID. Elevadores y brazos usan feedforward de gravedad.\n- **Perfiles de movimiento:** limitan velocidad y aceleración para moverse suave. En CTRE: **Motion Magic**; en REV: **MAXMotion**. Ambos corren en el controlador del motor.\n- **Diseño que ayuda al control:** poco juego (backlash), fricción baja y consistente, sensor bien colocado, reducción adecuada.\n\nEnlaces (WPILib): \n- Introducción a controles avanzados: https://docs.wpilib.org/en/stable/docs/software/advanced-controls/introduction/index.html (cubre PID, feedforward de motor DC, elevador con perfiles de movimiento, flywheel, torreta y brazo).\n- Sensores en WPILib: https://docs.wpilib.org/en/stable/docs/software/hardware-apis/sensors/index.html\n\n---\n\n## 10. Errores comunes\n\n1. Elegir el motor por moda y no por cálculo (sin pasar por ReCalc).\n2. Diseñar con la **free speed** como si fuera la velocidad real del mecanismo.\n3. Dejar el límite de corriente por defecto (80 A en SPARK) en mecanismos que no lo resisten.\n4. Conectar un motor brushless a un controlador brushed (o configurar mal el tipo de motor).\n5. No dejar acceso al conector, a la cuña o al tornillo del motor al armar.\n6. Encoder absoluto en el motor en lugar de en el eje de salida.\n7. Usar brake en un mecanismo con peso y creer que \"sostiene\" para siempre.\n8. Cadena o banda sin tensión o sin la distancia entre ejes calculada.\n9. Eje largo sin soporte de rodamiento en ambos lados.\n10. No verificar la legalidad de motores/controladores en el manual vigente.\n11. No guardar la configuración del controlador (parámetros sin persistir).\n12. Ruedas patinando porque no se limitó el stator del drive.\n\n---\n\n## 11. Checklist de selección\n\n**Antes de cotizar o diseñar**\n- [ ] Confirmé en el manual vigente (2026) que el motor y el controlador son legales (R501, R504) y que no paso de 4 motores de propulsión (R502).\n- [ ] Definí velocidad, carga y tiempo de recorrido del mecanismo.\n- [ ] Corrí ReCalc con motor, reducción, carga y límite de corriente; la corriente está lejos de stall.\n- [ ] Hay un controlador compatible con el motor (brushed/brushless correcto).\n- [ ] Revisé la interfaz de eje (hex, spline, keyed) y que el reductor la acepta.\n\n**Antes de fabricar**\n- [ ] Rodamientos en cada soporte; ejes alineados.\n- [ ] Cadena/banda con distancia entre ejes y tensión definidas.\n- [ ] Acceso a conectores, tornillos del motor y botón/LED del controlador.\n- [ ] Sensor/encoder en el eje de salida; ruta de cable sin tensión.\n- [ ] Brake/coast y topes (físicos y de software) definidos para cada mecanismo.\n\n**Antes de inspección / energizar**\n- [ ] Tipo de motor y límites de corriente configurados y guardados en cada controlador.\n- [ ] Robot sobre bloques en la primera prueba, con área despejada.\n- [ ] Cableado, breakers y conexiones revisados contra el manual vigente.\n- [ ] Un adulto/mentor supervisó la primera energización.\n\n---\n\n## Fuentes\n\n- Kraken X60 y X44 (rendimiento y datos), documentación de WCP: https://docs.wcproducts.com/welcome/llms-full.txt\n- Kraken X60 en la tienda de CTRE: https://store.ctr-electronics.com/products/kraken-x60\n- Kraken X44 en la tienda de CTRE: https://store.ctr-electronics.com/products/kraken-x44\n- Minion en la tienda de CTRE: https://store.ctr-electronics.com/products/minion-brushless-motor\n- Talon FXS en la tienda de CTRE: https://store.ctr-electronics.com/products/talon-fxs\n- Límites de corriente (CTRE, Phoenix 6): https://v6.docs.ctr-electronics.com/en/stable/docs/hardware-reference/talonfx/improving-performance-with-current-limits.html\n- NEO Vortex (REV): https://docs.revrobotics.com/brushless/neo/vortex\n- NEO v1.1 (REV): https://docs.revrobotics.com/brushless/neo/v1.1\n- NEO 550 (REV): https://docs.revrobotics.com/brushless/neo/550.md\n- Comparación NEO / Vortex (REV): https://docs.revrobotics.com/brushless/neo/compare\n- SPARK MAX especificaciones (REV): https://docs.revrobotics.com/brushless/spark-max/specs\n- SPARK MAX descripción general (REV): https://docs.revrobotics.com/brushless/spark-max/overview\n- SPARK Flex descripción general (REV): https://docs.revrobotics.com/brushless/spark-flex/overview\n- SPARK MAX \"Make it spin\" (límite de corriente, tipo de motor): https://docs.revrobotics.com/brushless/spark-max/gs/make-it-spin\n- MAXSwerve (REV): https://docs.revrobotics.com/ion-build-system/motion/maxswerve\n- Relaciones SDS MK4/MK4i (AndyMark): https://andymark.com/products/sds-gear-ratio-kits\n- SDS MK4i (SDS): https://www.swervedrivespecialties.com/products/mk4i-swerve-module\n- Datos de CIM, mini CIM, BAG, Falcon y pesos (wiki de FRC 3255): https://frcteam3255.github.io/Wiki/Mechanical/Motor%20Specs\n- Falcon 500 (Chief Delphi, 2023): https://www.chiefdelphi.com/t/2023-falcon-updates-and-availability/420604\n- WPILib, controles avanzados: https://docs.wpilib.org/en/stable/docs/software/advanced-controls/introduction/index.html\n- WPILib, sensores: https://docs.wpilib.org/en/stable/docs/software/hardware-apis/sensors/index.html\n- ReCalc: https://www.reca.lc (referencia de uso, no abierta durante la investigación)\n"},{"id":"prompts","title":"Prompts para aprender con IA","md":"# Prompts para aprender con IA\n\nPrompts listos para copiar en Claude, ChatGPT, Gemini o el asistente de Forja. Están hechos para que la IA **te enseñe y te haga pensar**, no para que haga el trabajo por ti.\n\n> **Reglas de uso del equipo**\n> - La IA se equivoca, sobre todo con reglas y números. **El manual FRC vigente siempre gana** (hoy 2026; desde el 9 ene 2027, el 2027). Si la IA cita una regla, búscala tú en el manual.\n> - Nunca pegues datos personales (nombres, correos, teléfonos) de alumnos.\n> - Si la respuesta implica riesgo (baterías, herramientas, máquinas), **pregúntale a un mentor antes de hacerlo**.\n> - Cambia lo que está entre `[corchetes]`.\n\n## 0. Prompt maestro (pégalo primero en cualquier chat nuevo)\n\n```\nActúa como mentor de un equipo de robótica FIRST Robotics Competition (FRC), Panteras 2283, de preparatoria en Ciudad de México. Diseñamos en Onshape, programamos en Java con WPILib (command-based) y usamos motores y controladores REV y CTRE.\nMi nivel: [nuevo / intermedio / avanzado]. Mi área: [mecánica y CAD / electrónica / programación / estrategia / organización].\nCómo quiero que me ayudes:\n- Explícame con ejemplos de robots FRC y en español sencillo; usa términos en inglés cuando así se usen en FRC.\n- Antes de darme una respuesta completa, hazme 1-3 preguntas para entender qué ya sé y qué intenté.\n- Prefiero pistas y preguntas guía antes que soluciones completas.\n- Si algo depende del reglamento, dime qué regla buscar en el manual vigente y no la interpretes como definitiva.\n- Si algo tiene riesgo de seguridad, dilo primero.\n- Al final, dame un mini reto o pregunta para comprobar que entendí.\n```\n\n## 1. Soy nuevo: ¿por dónde empiezo?\n\n```\nSoy nuevo en FRC y entro al área de [área]. Hazme un plan de aprendizaje de 4 semanas, 3-4 horas por semana, con:\n- Los 5 conceptos más importantes que debo dominar primero y por qué.\n- Un ejercicio práctico por semana que pueda hacer en el taller o en la computadora.\n- Recursos gratuitos oficiales (docs.wpilib.org, learn.onshape.com, firstinspires.org, fabricantes).\n- Palabras clave del área que voy a escuchar en el equipo, con definición de una línea.\nEmpieza preguntándome qué ya sé.\n```\n\n## 2. Explícame un concepto (modo profesor)\n\n```\nExplícame [concepto: p. ej. relación de reducción / PID / CAN bus / K-factor de doblez / swerve] en 3 niveles:\n1) Como si tuviera 12 años, con una analogía.\n2) Como alumno de prepa con física básica, con un ejemplo de un robot FRC.\n3) Lo que necesita saber alguien que lo va a diseñar o programar, con números típicos.\nDespués hazme 3 preguntas de opción múltiple para comprobar que entendí y espera mis respuestas.\n```\n\n## 3. Entender una regla del manual\n\n```\nTe pego el texto exacto de una regla del manual FRC [año] (sección [número]):\n\"\"\"\n[pega aquí la regla]\n\"\"\"\n1) Explícala en palabras simples.\n2) Dame 2 ejemplos de diseños que la cumplen y 2 que no.\n3) ¿Qué términos en MAYÚSCULAS (definidos en el manual) usa y qué significan?\n4) ¿Qué dudas razonables podrían ir al Q&A oficial?\nNo inventes texto que no esté en la regla; si no estás seguro, dilo.\n```\n\n## 4. Revisar un diseño para manufactura (DFM)\n\n```\nTe comparto [captura del Onshape / dibujo / descripción] de una pieza:\n- Material y espesor: [p. ej. aluminio 5052 de 0.090\"]\n- Proceso: [lámina doblada / router CNC / torno / impresión 3D en PETG / corte láser]\n- Función y cargas: [qué sostiene, de dónde le pegan]\n- Tornillería: [#10-32 socket / button / flat]\nRevísala como lo haría un ingeniero de manufactura. Dime en una tabla: problema, por qué importa, cómo corregirlo.\nRevisa: radios y distancias a dobleces y bordes, holguras de agujeros, accesos para herramienta y llave Allen, orientación de capas (si es 3D), puntos débiles y si se puede hacer más simple o ligera.\nNo rediseñes la pieza por mí: dame las observaciones y yo hago los cambios.\n```\n\n## 5. Elegir motor y reducción\n\n```\nNecesito elegir motor y relación de reducción para [mecanismo: elevador / brazo / intake / shooter / climber].\nDatos: carga [kg o lb], recorrido [distancia o ángulo], tiempo deseado [s], diámetro de polea/rueda/spool [in], motores que tenemos: [Kraken X60, NEO, NEO Vortex, NEO 550...].\n1) Explícame qué cálculo hay que hacer y por qué (velocidad, torque, corriente).\n2) Guíame paso a paso para que yo lo calcule; luego compara con lo que me daría ReCalc (reca.lc).\n3) ¿Qué límite de corriente pondrías y por qué?\n4) Riesgos: ¿qué pasa si me quedo corto o me paso de reducción?\n```\n\n## 6. Depurar código (WPILib, Java)\n\n```\nMi robot hace [lo que pasa] pero esperaba [lo que debería pasar].\nContexto: WPILib [versión], command-based, motor [modelo] con controlador [SPARK MAX / Talon FX].\nCódigo relevante:\n\"\"\"\n[pega solo la clase o método involucrado]\n\"\"\"\nMensajes de la Driver Station / consola:\n\"\"\"\n[pega errores]\n\"\"\"\nNo me reescribas todo. Primero dime 3 hipótesis ordenadas por probabilidad, cómo comprobar cada una (qué imprimir, qué ver en AdvantageScope o el Driver Station) y espera lo que encuentre.\n```\n\n## 7. Diagnosticar electrónica (brownouts, desconexiones, CAN)\n\n```\nSíntoma: [el robot se reinicia / se pierde la comunicación / un motor no responde / luces de error].\nCuándo pasa: [al acelerar / al subir el elevador / al azar].\nLo que ya revisé: [batería, conectores, luces de los controladores...].\nGuíame con un árbol de diagnóstico: de lo más probable y fácil de revisar a lo menos probable. Para cada paso dime qué debo ver (colores de LED, voltaje, logs) y qué significa.\nRecuérdame las precauciones de seguridad antes de tocar el robot energizado.\n```\n\n## 8. Analizar el juego después del kickoff\n\n```\nTe resumo el juego FRC [año]: [objetivos, cómo se anota, puntos de autónomo, teleop y endgame, ranking points].\nAyúdame a pensar como estratega:\n1) ¿Cuántos puntos hace un robot promedio, uno bueno y uno de élite? Explícame cómo lo estimas.\n2) Lista de acciones del robot ordenadas por puntos por segundo y por dificultad.\n3) ¿Qué es \"imprescindible\", \"deseable\" y \"aspiracional\" para un equipo con [nuestros recursos]?\n4) Preguntas que debemos responder en el manual antes de decidir.\nNo me digas qué robot construir; ayúdame a decidir con criterios.\n```\n\n## 9. Scouting y elección de alianza\n\n```\nTengo estos datos de scouting (sin nombres de alumnos):\n\"\"\"\n[pega tabla: equipo, partidos, puntos auto, teleop, endgame, defensa, fallas]\n\"\"\"\n1) ¿Qué métricas importan más para este juego y por qué?\n2) Ordena los equipos para elegir alianza según [nuestra estrategia] y explica el criterio.\n3) ¿Qué datos me faltan o son poco confiables?\nMuestra tus cálculos.\n```\n\n## 10. Impact Award, ensayos y presentaciones (sin que la IA lo escriba)\n\n```\nEste es mi borrador de [ensayo del Impact Award / presentación a jueces / correo a patrocinador]:\n\"\"\"\n[pega tu texto]\n\"\"\"\nNo lo reescribas. Dame retroalimentación como juez de FIRST:\n- 3 fortalezas y 3 cosas a mejorar, citando frases exactas.\n- ¿Dónde falta evidencia (números, fechas, impacto medible)?\n- Preguntas que me haría un juez después de leerlo.\n```\n\n## 11. Preparar una asesoría con un mentor\n\n```\nTengo 1 hora con un mentor experto en [área]. Situación: [semana de construcción, qué intentamos, qué tenemos que decidir].\nAyúdame a llegar preparado:\n1) Resume el problema en 5 líneas.\n2) Las 3 preguntas más valiosas que debo hacer.\n3) Qué información o fotos debo llevar.\n4) Cómo documentar acuerdos (qué, quién, cuándo).\n```\n\n## 12. Estudiar para dominar un tema (técnica Feynman)\n\n```\nVoy a explicarte [tema] como si tú fueras alumno nuevo del equipo. Después:\n- Señala lo que expliqué mal o incompleto.\n- Hazme preguntas \"¿y por qué?\" hasta que encuentre el límite de lo que sé.\n- Dame una lista de qué repasar y dónde (documentación oficial).\nMi explicación: [escribe aquí]\n```\n\n## 13. Retrospectiva después de un evento\n\n```\nAcabamos de competir en [evento]. Datos: récord [W-L-T], ranking [n], problemas [lista], lo que salió bien [lista].\nFacilita una retrospectiva:\n1) Agrupa los problemas por causa raíz (diseño, fabricación, software, estrategia, organización).\n2) Para cada causa, una acción concreta con responsable (rol, no nombre) y fecha.\n3) ¿Qué deberíamos dejar de hacer, empezar a hacer y seguir haciendo?\n```\n\n## Consejos para mejores respuestas\n\n- **Da contexto:** área, nivel, qué intentaste, qué esperabas. Más contexto, mejor respuesta.\n- **Pega texto real** (regla, código, error) en vez de describirlo de memoria.\n- **Pide fuentes** y verifícalas; si no las da, desconfía de los números.\n- **Itera:** \"más simple\", \"dame un ejemplo con un elevador\", \"¿y si el motor fuera un NEO?\".\n- **Pide que te pregunte:** \"antes de responder, hazme las preguntas que necesites\".\n- **Comprueba** con una pieza de prueba, un cálculo propio o un mentor antes de fabricar o cablear.\n"}];
const tabs=document.getElementById('tabs'),doc=document.getElementById('doc'),q=document.getElementById('q'),hits=document.getElementById('hits');
let cur=G[0].id;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(id,scrollTop=true){
  cur=id;const g=G.find(x=>x.id===id);
  let h=window.marked?marked.parse(g.md):'<pre>'+esc(g.md)+'</pre>';
  h=h.replace(/\[FIRST\]/g,'<span class="tag t-first">FIRST</span>').replace(/\[Fabricante\]/g,'<span class="tag t-fab">Fabricante</span>').replace(/\[Buena práctica\]/g,'<span class="tag t-bp">Buena práctica</span>');
  doc.innerHTML=h;
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.replaceWith(w);w.append(t)});
  doc.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  doc.querySelectorAll('input[type=checkbox]').forEach(c=>c.disabled=false);
  doc.querySelectorAll('pre').forEach(pre=>{const b=document.createElement('button');b.className='copy';b.textContent='Copiar';b.onclick=async()=>{const t=(pre.querySelector('code')||pre).textContent.trim();try{await navigator.clipboard.writeText(t);b.textContent='Copiado'}catch(e){const r=document.createRange();r.selectNodeContents(pre.querySelector('code')||pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Seleccionado: copia con Ctrl/Cmd+C'}setTimeout(()=>b.textContent='Copiar',2000)};pre.append(b)});
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));
  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  if(scrollTop)window.scrollTo(0,doc.offsetTop-80);
}
for(const g of G){const b=document.createElement('button');b.textContent=g.title;b.dataset.id=g.id;b.onclick=()=>show(g.id);tabs.append(b)}
q.oninput=()=>{
  const s=q.value.trim().toLowerCase();hits.textContent='';if(s.length<3)return;
  for(const g of G)for(const l of g.md.split('\n').filter(l=>l.toLowerCase().includes(s)).slice(0,4)){
    const b=document.createElement('button');const t=document.createElement('b');t.textContent=g.title+': ';b.append(t,l.replace(/[#*|`\[\]>]/g,' ').trim().slice(0,110));
    b.onclick=()=>{show(g.id);q.value='';hits.textContent=''};hits.append(b);
  }
  if(!hits.childElementCount)hits.textContent='Sin resultados.';
};
const start=location.hash.slice(1);show(G.some(g=>g.id===start)?start:cur,false);
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==cur&&G.some(g=>g.id===id))show(id)});
</script>
