er 7.2).\n2. **[Buena práctica]** **Perímetros > relleno**: 3-4 perímetros o más aportan más que subir el infill.\n3. **[Buena práctica]** Pon **radios (filetes) en esquinas internas** (≥1-2 mm); una esquina viva concentra el esfuerzo y ahí se rompe.\n4. **[Buena práctica]** Espesor mínimo de pared: al menos 3 perímetros (≈1.2-2 mm según boquilla); no diseñes paredes de 1 línea en piezas con carga.\n5. **[Buena práctica]** Para tornillos que se aprietan seguido: **inserto térmico** (heat-set) en vez de rosca impresa; **tuerca cautiva** si hay espacio (ver 7.3).\n6. **[Buena práctica]** Piezas que reciben golpes: **PA (nylon) o TPU**, no PLA.\n7. **[Buena práctica]** **PLA no** en zonas calientes (motores, regulación de potencia) ni donde haya impacto.\n8. **[Fabricante]** Seca el filamento (nylon sobre todo) y respeta temperaturas y cámara del fabricante (Bambu, Prusa, Polymaker); una pieza impresa con filamento húmedo sale débil y porosa.\n\nPor material del equipo (valores relativos, orientativos; confirma en la ficha técnica del filamento):\n\n| Material | Uso en el robot | Resist. / rigidez / impacto / temp. | Requisitos | Perímetros / relleno | No usar para |\n|---|---|---|---|---|---|\n| **PLA** | Prototipos, spacers, soportes ligeros | Rigidez alta / impacto bajo (frágil) / temp. baja (~55-60 C) | Sin cámara cerrada; cama ~55-60 C | 3 / 20-30 % | Zonas calientes, impacto, piezas con carga sostenida (se deforma) |\n| **PETG** | Soportes de sensores, cubiertas, piezas con algo de impacto | Resist. media / rigidez media / impacto medio / temp. media | Secar si está húmedo; cama ~70-80 C | 3-4 / 25-40 % | Cargas altas sostenidas; estructura crítica |\n| **PETG-GF / PA-GF** (fibra de vidrio) | Soportes rígidos, piezas estructurales ligeras | Rigidez alta / impacto medio / temp. media-alta (PA-GF mayor) | **Boquilla endurecida**; secar (PA-GF higroscópico); PA-GF cámara cerrada y cama ~80-100 C | 4 / 30-40 % | Piezas con contacto de desgaste (abrasivo); no lijar en seco |\n| **PA / Nylon** | Poleas, bujes, engranes, intake wheels, piezas con golpe | Resist. alta / rigidez media / **impacto alto** / temp. alta | **Secar el filamento (es higroscópico)** y secarlo durante la impresión; cámara cerrada; cama ~80-100 C | 4 / 30-40 % | Piezas de tolerancia fina sin considerar absorción de humedad (cambia medidas) |\n| **PA-CF** | Piezas estructurales ligeras y rígidas | Rigidez muy alta / impacto medio / temp. alta | **Boquilla endurecida**, secado, cámara cerrada; polvo de fibra: no lijar en seco | 4 / 30-40 % | Impacto fuerte (menos tenaz que PA liso); piezas que rozan otras piezas (abrasivo) |\n| **TPU** | Ruedas de intake, amortiguadores, fundas | Flexible; impacto muy alto; rigidez baja | Secar; imprimir lento, retracción mínima o nula; cama ~50-60 C | 3 / 15-25 % | Piezas que deban ser rígidas o precisas |\n\n**Recocido (annealing) de nylon / PA-CF (opcional):** calentar la pieza en horno (ver la ficha del filamento para temperatura y tiempo) mejora cristalinidad, rigidez y temperatura de uso, pero la pieza se encoge y deforma un poco: diseña con margen y haz una prueba. **Requiere adulto** (horno caliente).\n\n---\n\n### 7.1 Materiales\n\n| Material | Uso en FRC | Notas |\n|---|---|---|\n| **PLA / PLA+** | Prototipos, spacers, soportes simples, piezas decorativas | Fácil; se deforma con calor (~55-60 C), frágil |\n| **PETG** | Soportes de sensores, cubiertas, piezas con algo de impacto | Más tenaz y resistente al calor que PLA, algo flexible |\n| **ABS / ASA** | Piezas con calor o intemperie | Requiere cámara cerrada; humos: ventilar |\n| **Nylon (PA)** | Poleas, engranes, bujes, intake wheels | Muy tenaz y resistente al desgaste; higroscópico (secar el filamento) |\n| **Nylon-CF / PETG-CF** | Piezas estructurales ligeras y rígidas | Boquilla endurecida; polvo de fibra: no lijar en seco |\n| **TPU** | Ruedas de intake, amortiguadores, fundas | Flexible; imprime lento y sin retracción |\n\n### 7.2 Resistencia y orientación\n\n- Las capas son el eslabón débil: **la carga debe ir a lo largo de las capas, no despegándolas**. Orienta la pieza para que el esfuerzo no abra capas (no imprimas un gancho vertical con la carga hacia arriba).\n- **Paredes (perímetros):** 3-4 para piezas estructurales; el perímetro aporta más resistencia que el relleno.\n- **Relleno (infill):** 25-40 % (gyroid o cúbico) para piezas funcionales; 100 % solo para piezas muy pequeñas/cargadas (el aumento es poco versus más perímetros).\n- Capa 0.2 mm es buen compromiso; 0.12-0.16 mm para ajustes finos.\n\n### 7.3 Agujeros y ensambles\n\n- **Los agujeros salen chicos:** añade **0.2-0.4 mm** de holgura al diámetro. Para tornillos #10 (4.83 mm), diseña con ~5.1-5.2 mm.\n- **Insertos térmicos (heat-set):** agujero ligeramente menor que el diámetro exterior del inserto según la ficha del fabricante; calienta con soldador (~220-250 C para PLA/PETG; ajusta por material). Típico: M3 -> agujero ~4.0-4.2 mm; verifica el modelo exacto.\n- **Tuercas cautivas:** bolsillo hexagonal con holgura 0.2-0.3 mm por lado y lengüeta abierta para insertar.\n- **Overhangs y puentes:** >45 grados requiere soporte; puentes cortos (\u003c~30 mm) se imprimen bien. Diseña chaflanes en lugar de salientes.\n- **Tolerancia entre piezas impresas:** 0.2-0.4 mm de holgura entre piezas que deben deslizar o encajar.\n\n### 7.4 Cuándo NO imprimir\n\n- Piezas de **alto impacto** (colisiones directas, intakes que golpean la pared) a menos que sean de Nylon/TPU y estén diseñadas para sacrificarse.\n- Piezas cerca de **calor** (motores, conexiones de potencia) con PLA.\n- Estructura crítica de seguridad o que soporta cargas dinámicas altas.\n- Piezas que ya se fabrican mejor en lámina (más barato, más resistente).\n\n---\n\n## 8. Holguras y tolerancias recomendadas\n\n### 8.1 Agujeros de paso y rodamientos\n\n| Aplicación | Medida de diseño | Nota |\n|---|---|---|\n| Paso para **#10** (close fit) | 0.196\" (#9) | Poco juego, requiere buena precisión |\n| Paso para **#10** (free fit) | 0.201\" (#7) o 0.206\" (#5) | Recomendado en frames con tolerancias de taller |\n| Paso para **1/4-20** (close) | 0.257\" (F) | |\n| Paso para **1/4-20** (free) | 0.266\" (H) | |\n| Rodamiento **1.125\" OD** — *press fit* | ~1.123-1.124\" | Ajuste de prensa; prueba antes |\n| Rodamiento **1.125\" OD** — *slip fit* | ~1.126-1.128\" | Retener con tapa o anillo |\n| Eje hex **1/2\"** (agujero hex, ajuste holgado) | 0.503-0.505\" a través de planos | Mide con tu máquina; los hex tienden a redondearse |\n| Eje redondo | +0.002-0.005\" sobre el nominal | |\n\nEstas cifras son orientativas; **valida con una pieza de prueba**. **[Fabricante]** Consulta las recomendaciones de REV/WCP/AndyMark para sus rodamientos y ejes.\n\n### 8.2 Brocas para machuelo (tap drill)\n\n| Rosca | Broca (tap drill) | Equivalente |\n|---|---|---|\n| #6-32 | #36 | 0.1065\" |\n| #8-32 | #29 | 0.1360\" |\n| **#10-32** | **#21** | 0.1590\" |\n| **1/4-20** | **#7** | 0.2010\" |\n| M3 x 0.5 | 2.5 mm | |\n| M4 x 0.7 | 3.3 mm | |\n| M5 x 0.8 | 4.2 mm | |\n| M6 x 1.0 | 5.0 mm | |\n\nUsa fluido de corte, machuelo de espiral o de punta según el caso, gira 1/2 vuelta y retrocede 1/4 para romper la viruta.\n\n---\n\n## 9. Diseñar para ensamblar y reparar\n\n- **Acceso:** verifica en Onshape que cada tornillo se alcance con la llave/Allen real (modela una herramienta si es necesario).\n- **Misma tornillería:** limita a pocos tamaños (#10-32 y 1/4-20, M3-M5) para llevar menos herramientas y repuestos.\n- **Piezas simétricas** o que no admitan armarse al revés (o márcalas con asimetría clara).\n- **Repuestos:** fabrica 1-2 extras de las piezas que se rompen (intake, soportes, poleas).\n- **Meta:** cambiar un módulo completo (swerve, intake) en pits en **menos de 5 minutos**: conectores accesibles, tornillos grandes, sin pasos ocultos.\n- **Etiqueta** cables y piezas.\n\n---\n\n## 9.1 Reglas FIRST que afectan lo que fabricamos\n\n- **[FIRST]** (R301 2026) Ningún ítem no-KOP, comprado o fabricado, puede tener un valor justo de mercado (FMV) mayor a **$600 USD**. En piezas fabricadas cuenta el material (la cantidad mínima comprable de donde sale la pieza) y la mano de obra, excepto la de miembros del equipo, de otros equipos y de talleres del evento. Un kit o sistema vendido como conjunto cuenta completo.\n- **[FIRST]** (R302, R303 2026) Los MAJOR MECHANISMS no pueden construirse antes del kickoff; diseños y software previos solo valen si sus archivos fuente eran públicos antes del kickoff.\n- **[FIRST]** (R202, R206 2026) Nada de bordes filosos ni salientes que dañen el ARENA, las piezas de juego o personas: rebabea y lima. El acrílico u otros materiales que se astillan no están prohibidos, pero cualquier rotura debe corregirse de inmediato.\n- **[FIRST]** (R203 2026) No se permiten partes de materiales peligrosos (p. ej. plomo, encapsulado o no), lastre suelto, fluidos hidráulicos ni circuitos de más de 24 V.\n- **[FIRST]** (R201 2026) Las superficies de tracción no pueden tener elementos que dañen la alfombra (metal, lija, tacos rígidos, velcro).\n- **[FIRST]** (R103, R408 2026) Peso máximo 115 lb sin bumpers ni batería y 135 lb con bumpers: pesa las piezas fabricadas.\n- **[FIRST]** (R404 2026) Las partes duras de los bumpers (soportes, tornillos, plásticos duros) no pueden sobresalir más de 1.25\" del perímetro del robot.\n\n---\n\n## 10. Errores comunes\n\n- Dobleces demasiado cerca de agujeros o con radio inferior al permitido.\n- DXF en unidades incorrectas, o con líneas duplicadas.\n- Agujeros sin holgura para impresión/CNC (nada entra).\n- No pedir muestra de rodamiento: ajuste a presión inviable.\n- Usar 6061-T6 doblado con radio cerrado (se agrieta).\n- Olvidar rebabear y limar.\n- Tornillos sin Loctite o sin nyloc en zonas de vibración.\n- Cortar con láser un plástico no apto (PVC, policarbonato, ABS: gases tóxicos o mal corte) **[Buena práctica]**.\n\n## 11. Checklist antes de mandar a fabricar\n\n- [ ] Material y espesor correctos (5052 para doblez, 6061-T6 plano).\n- [ ] Radios y distancias a doblez/borde cumplen la tabla.\n- [ ] Flat pattern generado y DXF exportado a 1:1 en las unidades correctas.\n- [ ] Curvas cerradas, sin líneas duplicadas, sin cotas ni texto.\n- [ ] Agujeros con holgura según proceso (láser/router/3D).\n- [ ] Tolerancias de rodamientos y ejes verificadas con pieza de prueba.\n- [ ] Tornillería estandarizada y accesible.\n- [ ] Peso estimado y dentro del presupuesto del subsistema.\n- [ ] Un adulto revisó seguridad (láser, router, soldadura, taladro).\n- [ ] Cantidad de repuestos definida.\n- [ ] Nombre de archivo = nombre de pieza en Onshape.\n\n## Fuentes\n\n- Manual del Juego FRC 2026, sección 8 (R2xx, R3xx, R4xx; vigente)\n- https://firstfrc.blob.core.windows.net/frc2026/Manual/2026FRCInspectionChecklist.pdf\n- Valores de roscas, brocas y holguras: tablas estándar de maquinista (Machinery's Handbook); valores de proceso: práctica común de equipos FRC. Verifica con tu proveedor y fabricante (REV, WCP, Thrifty Bot, SendCutSend).\n"},{"id":"taller","title":"Herramientas y procesos de taller","md":"# Herramientas y procesos de taller\n\nGuía para elegir, usar y mantener las herramientas del taller del equipo: qué sirve para cada tarea, qué precisión esperar, qué riesgos tiene y quién puede operarla.\n\n> **Manual vigente: FRC 2026.** Las reglas [FIRST] citan el manual 2026; al salir el de 2027 (9 ene 2027) se actualizan y solo cuenta el vigente. Detalle completo en reglas-frc.md.\n>\n> Las reglas de seguridad del taller (EPP, guardas, inducción) son del equipo y del plantel; el manual 2026 (sección 8) no las define con detalle para cada máquina.\n>\n> **Regla general.** Ninguna herramienta de esta guía se usa sin **inducción firmada** y, en las máquinas de corte, taladro, esmeril, torno, fresadora, router CNC, láser y prensas, **con un adulto presente** (mentor o docente). Si no hay adulto, no se enciende la máquina.\n\n## Tarjeta rápida: tornillería #10 del equipo\n\nTornillos Allen #10 (diámetro 0.190\", ≈4.83 mm) en tres cabezas: **socket** (cilíndrica), **button** (botón) y **flat** (avellanada 82°). Casi todo el robot usa **#10-32 (fina)**; el **#10-24 (gruesa)** aparece en algunas piezas. Misma cabeza y mismo diámetro, **distinta cuerda y distinta broca**.\n\n| Operación | #10-32 (UNF, fina) | #10-24 (UNC, gruesa) |\n|---|---|---|\n| Identificar la cuerda | 32 hilos por pulgada (paso 0.031\"). Usa peine de roscas o compara con un tornillo conocido; si no entra al machuelo sin forzar, para | 24 hilos por pulgada (paso 0.042\"). Hilos visiblemente más separados |\n| Agujero de paso (Machinery's Handbook) | Close: #9 (0.196\") · Free: #5 (0.206\") | Igual: close #9 (0.196\") · free #5 (0.206\") |\n| Broca para machuelo (tap drill) | **#21** (0.159\") | **#25** (0.150\") |\n| Tipo de machuelo | Taper (punta cónica) para iniciar; plug para continuar; **bottoming** solo en agujero ciego, después del plug. Aluminio, agujero pasado: **machuelo de espiral (spiral point)** que empuja la viruta hacia adelante | Igual |\n| Lubricante | Aceite de corte o WD-40 (aluminio) | Igual |\n| Llave Allen | Socket: **5/32\"** · Button: **1/8\"** · Flat: **1/8\"** | Igual |\n| Avellanado (flat head) | Avellanador de **82°**; diámetro de avellanado ≈0.38-0.39\" (9.7-9.9 mm). **Verifica** con el tornillo real: la cabeza debe quedar al ras o 0.01\" abajo | Igual |\n| Largo mínimo de rosca en aluminio | ≥1.5×D = 0.29\" (7 mm); idealmente 2×D = 0.38\" (9.7 mm) | Igual; la cuerda gruesa es más débil en aluminio blando, prefiere 2×D |\n| Cuándo mejor tuerca o inserto | Lámina o pared **\u003c0.125\" (3.2 mm)**: la rosca no aguanta, usa tuerca (nyloc o con arandela). Rosca que se va a quitar y poner muchas veces, o aluminio blando: inserto (Helicoil o similar) | Igual |\n\n**[Fabricante]** broca de paso y de machuelo: Machinery's Handbook y tablas del fabricante del machuelo. **[Buena práctica]** tipo de machuelo, lubricante y largo de rosca. Llaves Allen: ASME B18.3 (cabeza socket 5/32\"; button y flat 1/8\" para #10), confirmado en fichas de proveedores; verifica con el tornillo que compres. El avellanado exacto **no se pudo confirmar**: prueba en un retal.\n\n### Qué taladro usar\n\n- **Taladro de banco** para todo agujero que se va a machuelar: queda perpendicular y la rosca sale recta.\n- **Taladro de mano** solo para agujeros de paso en piezas grandes que no caben en el banco, con la pieza bien sujeta.\n\nSecuencia:\n\n1. Punto de centro (center punch) en la marca.\n2. Broca piloto (1/8\" aprox.) si el agujero final es mayor a 1/4\".\n3. Broca final (de paso o de machuelo, según la tabla).\n4. Desbarbar los dos lados (avellanador o broca grande girada a mano).\n5. Machuelar recto: usa la guía del taladro de banco (punto de centro en el mandril) o una escuadra; gira **1/2 vuelta adelante y 1/4 atrás**, con lubricante.\n6. Limpia la viruta y prueba con el tornillo real.\n\n### Errores comunes con la tornillería #10\n\n- Usar la broca de 10-32 (#21) con un tornillo 10-24 (o al revés): rosca floja o machuelo forzado. Revisa los hilos por pulgada antes.\n- Machuelar chueco por hacerlo a mano sin guía; el tornillo se atora o queda inclinado.\n- Romper el machuelo en un agujero ciego: usa bottoming al final, retrocede seguido y deja espacio de viruta al fondo. Un machuelo roto no se saca con un adulto ausente: avisa.\n- Llave Allen equivocada (5/32\" en un button) que redondea el hexágono.\n- Rosca en lámina delgada (\u003c0.125\"): se barre al apretar; usa tuerca.\n\n## Leyenda\n\n- **[FIRST]** requisito del manual FRC 2026, con su número de regla.\n- **[Fabricante]** recomendación del fabricante de la herramienta o del material.\n- **[Buena práctica]** práctica común de equipos FRC y talleres de seguridad.\n- **Orientativo** valor de referencia. Siempre se confirma con la hoja del fabricante o con una prueba en retal.\n\n## Antes de usar cualquier herramienta\n\n- [ ] Tienes tu inducción firmada para esa herramienta (ver checklist al final).\n- [ ] Hay un adulto presente que puede ver lo que haces.\n- [ ] Llevas lentes de seguridad puestos antes de encender la máquina.\n- [ ] Tienes el cabello recogido, sin joyas, sin ropa suelta, con zapatos cerrados.\n- [ ] Sabes dónde está el paro de emergencia y el extintor.\n- [ ] Leíste el dibujo o la pieza y sabes qué vas a cortar, taladrar o doblar.\n- [ ] Tu pieza está sujeta (prensa, tornillo de banco o abrazadera). Nunca la sostienes con la mano en una máquina rotativa.\n\n## ¿Qué herramienta uso para…?\n\n| Tarea | Herramienta recomendada | Alternativa | No uses |\n|---|---|---|---|\n| Cortar tubo (aluminio o acero) | Sierra cinta horizontal o ingletadora con disco no ferroso | Cortatubos (tubo pequeño, corte limpio) o segueta (sin máquina, lento) | Disco abrasivo de corte (chop saw) en aluminio |\n| Hacer agujero de 1/2\" para eje hexagonal (hex bore) | Fresadora o router CNC con fresa de punta (hex fresado) | Agujero redondo de tamaño intermedio + lima hasta medir el eje real | Taladro de mano sin guía |\n| Agujero para rodamiento | Taladro de banco para piloto; fresadora o mandrinado para el diámetro final | Prensa de husillo (arbor press) para meter el rodamiento | Martillo para meter el rodamiento |\n| Doblar lámina | Dobladora de lámina (brake) | Prensa con dados de madera o aluminio (solo piezas simples) | Martillo sobre la pieza sin dado |\n| Cortar policarbonato (Lexan) | Router con fresa para laminado, o sierra cinta de dientes finos a velocidad moderada | Corte con segueta de dientes finos y lima | Láser (el policarbonato es riesgo de fuego y gases) y disco abrasivo |\n| Roscar (hacer rosca interna) | Machuelo sobre agujero de broca correcta | Machuelo de mano con guía a escuadra | Machuelo sin taladrina o sin revisar la broca |\n| Roscar (hacer rosca externa) | Terraja | Terraja de mano | Lima o segueta para roscar |\n| Remachar lámina sin acceso a ambos lados | Remachadora POP | Remachadora neumática si hay mucha producción | Remaches de acero en aluminio (corrosión) |\n| Meter o sacar un buje o rodamiento | Prensa de husillo (arbor press) | Tornillo de banco con adaptadores | Golpear con martillo |\n\n## Taladrado\n\n### Taladro de mano vs taladro de banco\n\n| Criterio | Taladro de mano | Taladro de banco (drill press) |\n|---|---|---|\n| Para qué sí | Agujeros en lugares donde la pieza no cabe en la máquina; agujeros rápidos y de baja precisión; atornillar | Agujeros en piezas planas, perpendiculares, en la misma posición y en serie |\n| Para qué no | Agujeros perpendiculares precisos; agujeros de precisión repetibles; brocas grandes sin soporte | Piezas muy grandes o que no se pueden sujetar; trabajo en el suelo o en el aire |\n| Precisión esperada | Orientativo: decenas de milésimas a décimas de pulgada; la perpendicularidad depende de la mano | Orientativo: milésimas de pulgada en posición si la pieza está bien sujeta; la perpendicularidad depende de la mesa y la mordaza |\n| Riesgos y EPP | Atorarse, girar la pieza, quemar la mano con la broca caliente; lentes, cabello recogido | Atrapamiento de guantes, cabello, ropa; pieza que sale volando; virutas calientes; lentes y sin guantes |\n| Quién puede usarla | Alumno con inducción; adulto presente | Alumno con inducción; adulto presente |\n\n**Por qué el taladro de banco da agujeros perpendiculares y repetibles:**\n- El husillo se mueve sobre una columna guiada, así que la broca baja en línea recta respecto a la mesa.\n- La mesa se puede ajustar a 90° y se fija; la pieza se apoya sobre ella y no cambia de ángulo.\n- El tope de profundidad permite repetir la misma profundidad en varias piezas.\n- El avance con palanca es constante y se controla con las dos manos fuera de la broca.\n- Consecuencia: si fijas la pieza y el tope, cada agujero queda en el mismo lugar y con el mismo ángulo.\n\n**Cuándo usar cada uno:**\n- Usa el **taladro de banco** para cualquier agujero que deba quedar perpendicular, en un lugar exacto o que se repita (placas de montaje, chasis, rodamientos).\n- Usa el **taladro de mano** para agujeros de referencia, para atornillar o cuando la pieza no entra en la máquina. Si necesitas perpendicularidad con taladro de mano, usa una guía o un bloque en escuadra.\n\n### Prensa de sujeción\n\n- **[Buena práctica]** Sujeta siempre la pieza con prensa de máquina (vise) o con abrazaderas. Una pieza suelta gira con la broca, se atora y sale volando.\n- Coloca la prensa con la mordaza fija hacia el lado de la fuerza de empuje (contra el movimiento del avance), no en el aire.\n- Pon un bloque de sacrificio (madera, aluminio o retal) debajo de la pieza para no taladrar la mesa. No taladres en la mesa de la máquina.\n- En piezas pequeñas (o cuando la broca es grande), usa siempre prensa; nunca con los dedos.\n\n### Punto de centro\n\n- **[Buena práctica]** Marca el centro con un **punto de centro** (center punch) antes de taladrar. La broca no se \"va\" con el punto y el agujero queda donde lo marcaste.\n- Usa el martillo con golpe firme y corto sobre el punto, en vertical.\n- En metal, marca siempre antes de taladrar, sobre todo en brocas de diámetro pequeño (un punto de partida evita que la broca patine).\n- En plásticos, el punto puede rayar; marca con cinta de enmascarar y un lápiz.\n\n### Brocas\n\nElige la broca según material y tipo de agujero. Cada broca tiene un tipo de acero o recubrimiento.\n\n| Tipo | Para qué sí | Para qué no | Notas |\n|---|---|---|---|\n| **HSS** (acero rápido) | Aluminio, acero dulce, madera, plástico, uso general | Acero inoxidable endurecido, aceros templados a alta velocidad | Es la broca de uso general. Se desafila rápido en inoxidable |\n| **Cobalto** (HSS-Co) | Acero inoxidable, aceros más duros, acero con aleaciones | Uso sin máquina rígida o con vibración | Aguanta más calor; más cara. Orientativo: puede trabajar a velocidades mayores que HSS |\n| **Escalonada** (step drill) | Lámina delgada, agujeros de varias medidas en un solo paso, plástico y policarbonato | Piezas gruesas (\u003c1/8\") y agujeros muy profundos | Hace agujeros limpios en lámina sin rebabas grandes. Se usa a velocidad alta |\n| **Carburo** | Material muy duro, producción | Mala con golpes o flexión | Frágil. Se usa solo con máquina rígida |\n\n**Lubricante (taladrina o aceite de corte):**\n- **[Buena práctica]** Acero: aceite de corte o taladrina. Acero inoxidable: aceite de corte con buena capacidad de extrema presión.\n- Aluminio: aceite de corte o cera para aluminio. Evita que la viruta se pegue a la broca.\n- Plástico: normalmente sin lubricante o con poco; refrigeración con agua si la pieza se calienta (ver policarbonato en Fuentes).\n- No uses gasolina, diluyentes ni solventes inflamables como lubricante.\n\n**Afilado:** una broca desafilada hace humo, quema el material y se atora. Si una broca hace polvo en vez de viruta, deja de usarla y afílala o cámbiala.\n\n### Velocidad según material y diámetro\n\nRegla: las brocas grandes van más lentas y el material duro también. La velocidad de corte se mide en pies por minuto (SFM, surface feet per minute), y las RPM se calculan así:\n\n**RPM ≈ (SFM × 3.82) / diámetro en pulgadas**\n\nEjemplos (orientativo):\n\n| Material | SFM (HSS) orientativo | Broca 1/8\" | Broca 1/4\" | Broca 1/2\" |\n|---|---|---|---|---|\n| Aluminio (6061) | 200 a 300 | ~6,100 a 9,200 | ~3,000 a 4,600 | ~1,500 a 2,300 |\n| Acero dulce (1018) | 60 a 90 | ~1,800 a 2,750 | ~900 a 1,375 | ~460 a 690 |\n| Acero inoxidable (304) | 20 a 40 | ~610 a 1,220 | ~300 a 610 | ~150 a 300 |\n| Acrílico y policarbonato | 100 a 300, con avance lento | (probar) | (probar) | (probar) |\n\nNotas:\n- Los valores son de referencia; confirma con la hoja del fabricante de la broca y con una prueba en retal.\n- Algunas fuentes dan números inconsistentes. No uses una tabla que no puedas comprobar con esta fórmula.\n- Las brocas de cobalto y carburo tienen velocidades distintas a HSS; no uses la misma tabla.\n- **[Buena práctica]** Empieza bajo. Si oyes chillido, humo o la broca se pone azul, baja la velocidad o agrega lubricante.\n\n### Brocas y agujeros profundos (picoteo)\n\n- Para profundidad mayor a 1 diámetro, saca la broca varias veces (picoteo) para expulsar viruta.\n- Avanza con presión constante. Una presión excesiva rompe la broca; una presión muy suave hace que la broca patine o raye.\n- En aluminio, la viruta se pega; saca la broca a menudo y límpiala.\n\n### Agujeros para rodamientos\n\n- Un rodamiento se mete en su alojamiento con **ajuste de interferencia** (press fit). El alojamiento debe quedar un poco menor que el diámetro exterior del rodamiento, y el ajuste lo define el fabricante del rodamiento o el diseño.\n- **Precisión esperada:** no se logra con taladro de mano. En banco se logra el diámetro de piloto; el diámetro final se logra con fresado, mandrinado o escariador (reamer) según el diseño.\n- **[Buena práctica]** Haz una prueba con una pieza de prueba antes de cortar la pieza final. Un chat de Chief Delphi reporta que la anodización en el alojamiento puede hacer el ajuste demasiado apretado; en ese caso se enmascara o se limpia la anodización dentro del agujero.\n- Mete el rodamiento con una prensa de husillo (ver sección de prensa de husillo), no con martillo.\n\n### Agujeros hexagonales (1/2\" hex)\n\n- **[Buena práctica]** Un agujero hexagonal se hace fresando (fresadora o router CNC con fresa de punta) o con mecanizado, no con taladro. Un taladro solo hace un agujero redondo.\n- Alternativa en taller: haz un agujero redondo de tamaño intermedio y ajusta con lima hasta que entre el eje real. Mide con el eje real, no con la cota del dibujo.\n- La medida del hex y del eje depende del fabricante; confirma con los datos del fabricante del eje o de la maza antes de maquinar.\n\n## Roscado: machuelos y terrajas\n\n- **Machuelo (tap)** hace rosca **interna** en un agujero.\n- **Terraja (die)** hace rosca **externa** en un eje o barra.\n- La broca para el machuelo tiene que ser la **broca de roscado**, no una broca al azar. Si la broca es chica, el machuelo se rompe; si es grande, la rosca queda floja.\n\n### Tabla de brocas de roscado (ejemplos)\n\n| Rosca | Broca de roscado | Diámetro aprox. (in) |\n|---|---|---|\n| 0-80 UNF | 3/64\" | 0.047 |\n| 6-32 UNC | #36 | 0.106 |\n| 8-32 UNC | #29 | 0.136 |\n| 10-24 UNC | #25 | 0.150 |\n| 10-32 UNF | #21 | 0.159 |\n| 1/4-20 UNC | #7 | 0.201 |\n| 1/2-13 UNC | 27/64\" | 0.422 |\n| 1/2-20 UNF | 29/64\" | 0.453 |\n\nValores de búsqueda con varias fuentes de tablas de brocas; **confirma en la tabla del fabricante del machuelo** antes de taladrar.\n\nPara los tornillos #10 del equipo, ve la **Tarjeta rápida: tornillería #10** al inicio de esta guía.\n\nNota: #10-24 UNC y #10-32 UNF tienen el mismo diámetro exterior y **brocas distintas** (#25 y #21). Revisa el paso (hilos por pulgada) antes de elegir la broca.\n\n### Cómo roscar\n\n1. Taladra con la broca correcta y con punto de centro.\n2. Pon el machuelo derecho (perpendicular); usa una guía o escuadra.\n3. Avanza media vuelta y regresa un cuarto de vuelta para romper la viruta.\n4. Usa aceite de corte (acero) o cera (aluminio).\n5. Limpia la viruta con cepillo de alambre.\n\nErrores típicos: machuelo torcido, rosca floja por broca grande, machuelo roto por no retroceder.\n\nPara terraja: lima la punta de la barra a 45°, ponla en la terraja y avanza igual que el machuelo.\n\n## Corte\n\n### Sierra cinta (bandsaw)\n\nHay dos tipos:\n- **Vertical:** corta curvas, formas y piezas sobre la mesa. Para piezas planas (lámina, plástico, madera).\n- **Horizontal:** corta barras, tubos y perfiles en ángulo recto o a ángulo. Para material largo.\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Formas en lámina, perfiles, barras, tubos, plásticos con hoja fina |\n| Para qué no | Piezas muy pequeñas (no se sujetan con seguridad); cortes muy precisos sin fresa o lima después |\n| Precisión esperada | Orientativo: décimas de pulgada; con guía y lima, mejor |\n| Riesgos y EPP | Hoja expuesta, punto de atrapamiento (la hoja entre las guías), dedos, pieza que se mueve; lentes; sin guantes |\n| Quién puede usarla | Alumno con inducción; adulto presente |\n\n- **[Buena práctica]** Ajusta la guía a 1/8\" a 1/4\" por encima de la pieza (o al mínimo que quede libre para la pieza).\n- Ajusta la tensión de la hoja según el manual de la máquina. Una hoja floja se sale; una hoja muy tensa se rompe.\n- Usa hoja con al menos **3 dientes dentro de la pieza** en cada momento. Menos dientes atoran la hoja.\n- Para plásticos y policarbonato: hoja de dientes finos y velocidad moderada. Dientes gruesos muerden, agrietan o rompen el material.\n- Mantén las manos a distancia de la hoja y empuja la pieza con empujador de madera o plástico cuando se acerque a la hoja.\n- Apaga y espera a que la hoja se detenga antes de soltar la pieza.\n\n### Ingletadora (chop saw) con disco para aluminio\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Cortes rectos y en ángulo de tubo, perfil y barra de aluminio con disco específico no ferroso |\n| Para qué no | Aluminio con disco abrasivo de corte; piezas que no se pueden sujetar; cortes de precisión sin medir |\n| Precisión esperada | Orientativo: décimas de pulgada; con tope y medición, mejor |\n| Riesgos y EPP | **Rebote** (kickback) si el disco se atora; pieza que sale disparada; viruta caliente; ruido; lentes, protección auditiva; sin guantes |\n| Quién puede usarla | Alumno con inducción; adulto presente |\n\nRiesgos específicos del aluminio:\n- **[Buena práctica]** Usa un **disco de carburo para aluminio y metales no ferrosos** (dientes de ángulo negativo, orientativo). No uses disco abrasivo de corte en aluminio: se carga de metal, se atora y puede rebotar violentamente.\n- No cortes aluminio con un disco que sirve para acero o madera.\n- Alimenta más lento que con madera (orientativo: alrededor de un tercio más lento), para que el diente no se llene.\n- Usa cera o lubricante para aluminio en el disco (con la máquina apagada) para que la viruta no se pegue.\n- Nunca sostengas la pieza con la mano; sujétala en la mordaza o tope.\n- Revisa que la guarda inferior se mueva libremente y regrese sola antes de cada uso. Nunca la dejes abierta con cinta o pinza.\n- No pongas la máquina a un lado hasta que el disco se detenga por completo (sigue girando solo).\n- Ponte de lado al disco, no en línea con él, y mantén las manos fuera de la zona de corte.\n\n**Nota de fuentes:** las recomendaciones de disco y lubricante vienen de fabricantes de discos y blogs, no de una norma. Confírmalas con el manual de la ingletadora y con el disco.\n\n### Segueta (hacksaw)\n\n- Sirve para cortar material pequeño o cuando no hay máquina. Es lenta y da cortes tan limpios como la mano.\n- **[Buena práctica]** Usa hoja de 24 dientes por pulgada para lámina delgada y tubo; 18 dientes por pulgada para material grueso. Al menos tres dientes dentro de la pieza.\n- Empuja en la carrera de corte (hacia adelante) y levanta un poco en la carrera de regreso. No aprietes en el regreso.\n- Sujeta la pieza firmemente; no la sostengas con los dedos cerca de la hoja.\n- Riesgo: la hoja se rompe y los fragmentos salen volando. Lentes y cuidado con la mano libre.\n- Precisión: orientativo, décimas de pulgada a mano; mejor con guía y lima.\n- Quién puede usarla: alumno con inducción; adulto presente cuando la pieza es grande o el corte es largo.\n\n### Cortatubos (tubing cutter)\n\n- Corta tubo pequeño (aluminio o cobre) con corte limpio y recto.\n- Gira el tubo mientras aprietas la rueda poco a poco.\n- Quita la rebaba interna con lima o desbarbador.\n- Riesgo bajo. Lentes; cuidado con la rebaba.\n\n## Esmerilado, pulido y acabado\n\n### Esmeril (bench grinder) y Dremel\n\n| Criterio | Esmeril de banco | Dremel (herramienta rotativa) |\n|---|---|---|\n| Para qué sí | Afilar herramienta, desbastar rebaba, quitar material grueso | Detalles pequeños, rebaba fina, pulido, grabado, cortes pequeños con disco delgado |\n| Para qué no | Piezas pequeñas que no se sujetan; cortes precisos | Desbaste grueso; piezas grandes; cortes profundos |\n| Precisión esperada | Baja; depende de la mano | Baja; depende de la mano y de la fijación |\n| Riesgos y EPP | Atrapamiento de la pieza entre el disco y el apoyo; disco que se rompe; chispas y viruta caliente | Disco delgado que se rompe a alta velocidad; polvo; piezas que se disparan; lentes **y careta** |\n| Quién puede usarla | Alumno con inducción; adulto presente | Alumno con inducción; adulto presente |\n\nReglas del esmeril:\n- **[Buena práctica]** Usa protección facial (careta) además de lentes en esmeril.\n- Ajusta el apoyo (tool rest) a no más de 1/8\" (3 mm) del disco. Si la pieza se mete en el hueco, puede atorarse y rebotar.\n- La velocidad de la máquina nunca debe superar la velocidad máxima marcada en el disco. Un disco con velocidad máxima menor se rompe.\n- No uses el lado del disco de corte para desbastar; el disco de corte se usa solo de frente.\n- Pasa la pieza de un lado a otro; no te quedes en un punto (calor y pérdida de temple en el acero).\n- Revisa el disco antes de encender: no debe tener grietas, astillas ni estar mojado.\n\nReglas del Dremel:\n- Mantén la herramienta con las dos manos cuando sea posible y con poco ángulo.\n- Usa disco de corte delgado solo a velocidad moderada y con la pieza sujeta.\n- Ponte careta, porque los fragmentos de disco y las astillas salen a alta velocidad.\n- Cambia la pieza de trabajo a una prensa si es pequeña.\n\n### Lijadora de banda (belt sander)\n\n- Para desbastar y dar forma plana o curva a piezas. Sirve para quitar material rápido.\n- Riesgo: atrapamiento de dedos en el rodillo y en la banda; piezas que se mueven; polvo.\n- **[Buena práctica]** Usa la banda en la dirección de giro marcada. Sujeta la pieza con prensa.\n- Quién puede usarla: alumno con inducción; adulto presente.\n- Precisión: baja; orientativo.\n\n### Limas y desbarbado\n\n- Las limas sirven para dar forma, quitar rebaba y ajustar piezas en pequeñas cantidades.\n- Limas con mango: el mango se pone antes de usar. Nunca uses una lima sin mango; la punta puede clavarse en la mano.\n- **[Buena práctica]** Desbarba todo corte y todo agujero antes de ensamblar. Un borde afilado corta la mano y daña el cable o el sello.\n- Quita la rebaba con lima de mano, con broca escalonada o con desbarbador de chaflán (45° o ligero).\n- Riesgo bajo; lentes y guantes de trabajo **cuando no hay máquina girando** (ver regla de guantes).\n\n## Remachado y unión\n\n### Remachadora POP (hand riveter)\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Unir láminas o piezas cuando solo tienes acceso a un lado; uniones permanentes ligeras |\n| Para qué no | Cargas estructurales altas (usa tornillo o perno); acero inoxidable con remache de aluminio |\n| Precisión esperada | Agujero: 0.1 a 0.2 mm más grande que el remache según el fabricante del remache |\n| Riesgos y EPP | El vástago (mandril) sale disparado; bordes afilados; lentes siempre |\n| Quién puede usarla | Alumno con inducción; adulto presente cuando se usa en la pieza final |\n\n- **[Fabricante]** Elige el remache según el diámetro, el rango de agarre (grip range) y el material. El rango de agarre es el espesor total de las piezas que se unen. Ver la tabla del fabricante.\n- **[Buena práctica]** Usa remache de aluminio en aluminio y de acero en acero. El aluminio no debe usarse con acero inoxidable (corrosión).\n- Revisa que la herramienta esté clasificada para el diámetro del remache (ej. 3.2 a 6.4 mm).\n- Taladra un agujero ligeramente mayor que el remache; un agujero muy grande deja el remache flojo.\n- Cuidado: el mandril se corta y sale disparado, y también se corta al doblar el remache. Lentes siempre.\n\n### Remachadora neumática\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Producción de muchos remaches; uniones repetidas |\n| Para qué no | Piezas sin sujeción; lugares donde no se puede sujetar la herramienta |\n| Precisión esperada | Igual que la POP en el agujero; más consistente en la fuerza |\n| Riesgos y EPP | Aire a presión; mangueras que se sueltan; ruido; vástagos que salen disparados; lentes y protección auditiva |\n| Quién puede usarla | Alumno con inducción; adulto presente |\n\n- **[Fabricante]** Ajusta la presión del aire según el manual de la herramienta. No excedas la presión máxima.\n- Nunca apuntes la manguera de aire hacia una persona ni la uses para limpiar la ropa o el cuerpo.\n- Revisa que las mangueras estén bien conectadas y sin fugas antes de conectar el compresor.\n\n### Prensa de husillo (arbor press)\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Meter rodamientos, bujes y pasadores en su alojamiento; sacarlos; enderezar |\n| Para qué no | Piezas que no están bien alineadas; golpes (la prensa no es para martillar) |\n| Precisión esperada | Orientativo: el alineamiento depende de la pieza y del dado; con alineación correcta, buena repetibilidad |\n| Riesgos y EPP | Pieza que salta; dedos atrapados entre la pieza y el dado; lentes |\n| Quién puede usarla | Alumno con inducción; adulto presente |\n\n- **[Buena práctica]** Presiona **por la pista que se mete** (el aro exterior del rodamiento cuando lo metes en el alojamiento; el aro interior cuando lo metes sobre un eje). Presionar por la otra pista daña el rodamiento.\n- Usa un casquillo o adaptador de diámetro adecuado para no deformar el rodamiento.\n- Alinea la pieza y el dado antes de presionar. Una pieza torcida se traba y se rompe.\n- Presiona despacio y revisa el progreso. Si se traba, detente y revisa el ajuste; no fuerces.\n- [Buena práctica] Antes de meter el rodamiento en la pieza final, pruébalo en una pieza de prueba del mismo material.\n\n## Formado de lámina\n\n### Dobladora de lámina (brake)\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Dobleces rectos y repetibles en lámina de aluminio o acero delgado |\n| Para qué no | Láminas muy gruesas para la capacidad de la máquina; dobleces muy cerrados sin revisar el material |\n| Precisión esperada | Orientativo: décimas de grado si la máquina está bien calibrada y el material es constante; el resorte (springback) cambia el ángulo |\n| Riesgos y EPP | Puntos de atrapamiento entre la hoja y el dado; bordes afilados; pieza que se mueve; lentes; guantes de trabajo **solo al manipular la lámina fuera de la máquina** |\n| Quién puede usarla | Alumno con inducción; adulto presente |\n\nReglas de dobladora:\n- **[Buena práctica]** Radio interior mínimo para aluminio 5052 (orientativo): entre 0 y 1 veces el espesor, según la temple y el proveedor. Como punto de partida seguro, usa **1 T** (radio igual al espesor) y ajusta con pruebas.\n- Fuentes distintas dan valores diferentes para el mismo material. Confirma con el proveedor del material.\n- El **radio recomendado** no es el mínimo que se puede lograr; el radio mínimo depende del material y del dado.\n- Dobla con la dirección del grano (la fibra del material) cuando sea posible; doblar a través del grano aumenta el riesgo de agrietar.\n- Para calcular el desarrollo (flat length), usa la tabla de tolerancia de doblez del fabricante de la dobladora o de la lámina. No inventes la constante K; mídela con una pieza de prueba.\n- Mantén los dedos fuera del área entre hoja y dado. Usa palos o herramientas para mover la pieza.\n- Quita las rebabas antes de doblar.\n\n## Máquinas de mayor riesgo (introducción)\n\nEstas máquinas no se usan sin formación formal y un adulto presente. Aquí solo se describen para que sepas qué implican.\n\n### Fresadora manual (milling machine)\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Ranuras, superficies planas, agujeros de forma (hex, cuadrados), contornos |\n| Para qué no | Piezas que no se pueden sujetar; fresa rota sin cambiar; corte sin conocer la velocidad |\n| Precisión esperada | Orientativo: milésimas de pulgada con dial y buena sujeción |\n| Riesgos y EPP | Fresa que gira; viruta afilada; pieza que se mueve; cabello y guantes atrapados; lentes; **sin guantes en la máquina** |\n| Quién puede usarla | Solo con formación formal y adulto presente |\n\n### Torno básico de velocidad fija (carburo)\n\nEl torno del equipo es básico: **RPM fijas** (no se cambian) y herramienta de **carburo**, usado para aluminio. Riesgos: el mandril y la pieza giran; atrapamiento de cabello, guantes y ropa; viruta caliente y afilada. Solo con formación formal y adulto presente.\n\n| Sí hacemos | No hacemos |\n|---|---|\n| Refrentar (facing) y cilindrar (turning) | Piezas largas y delgadas sin contrapunto |\n| Separadores (spacers) y bujes | Cortes pesados o desbaste agresivo |\n| Rebajar ejes (reducir diámetro) | Roscar a mano con la máquina girando |\n| Chaflanes | Acero endurecido o materiales desconocidos |\n| Ranurar con cuidado, poco avance | Lijar o limar con la máquina sin supervisión directa del adulto |\n| Taladrar al centro: broca de centro y luego broca, desde el contrapunto | Cualquier operación que el adulto no haya autorizado |\n\n**Trabajar sin cambiar RPM.** **[Buena práctica]** El carburo quiere velocidad superficial alta. Con RPM fijas, en diámetros pequeños funciona bien y en diámetros grandes la velocidad en el borde sube mucho (la pieza vibra, la viruta se pega): no tornees diámetros grandes sin que el adulto lo apruebe. Como no puedes cambiar RPM, controlas con **avance** y **profundidad de corte**.\n\nValores de partida para aluminio (orientativo, ajusta con el adulto y una prueba en retal):\n\n| Pasada | Profundidad de corte | Avance por vuelta |\n|---|---|---|\n| Desbaste | 0.020-0.040\" (0.5-1.0 mm) | 0.004-0.008\"/rev (0.10-0.20 mm/rev) |\n| Acabado | 0.005-0.010\" (0.13-0.25 mm) | 0.002-0.004\"/rev (0.05-0.10 mm/rev) |\n\nRecuerda que la profundidad de corte quita el doble del diámetro: 0.020\" de corte reduce 0.040\" el diámetro.\n\nReglas de montaje y herramienta:\n\n- **Altura al centro:** la punta de la herramienta a la altura exacta del centro de la pieza. Si está baja o alta, el corte es malo y la pieza puede \"subirse\".\n- **Saliente mínimo:** **[Buena práctica]** sin contrapunto, la pieza sale del mandril **≤3× su diámetro**. Más largo: usa contrapunto.\n- **Insertos para aluminio:** **[Fabricante]** (Sandvik y otros) insertos **pulidos (ground), de ángulo positivo, sin recubrimiento o PVD**, por ejemplo tipo CCGT o DCGT. Los insertos para acero dejan aluminio pegado. El adulto elige el inserto.\n- **Lubricante:** WD-40 o alcohol isopropílico con brocha o spray corto. Evita que la viruta se suelde al filo (BUE, built-up edge).\n- **Viruta:** busca viruta que se rompa en rizos cortos; avance muy bajo hace viruta larga que enreda. Retírala con gancho o cepillo, **nunca con la mano** y con la máquina parada.\n\nSeguridad:\n\n- Mide **solo con la máquina parada** (calibrador).\n- **Nunca dejes la llave del mandril puesta.** Quítala antes de encender.\n- Sin guantes, sin mangas sueltas, cabello recogido, lentes de seguridad.\n- Paro de emergencia a la mano; el adulto a la vista.\n\nChecklist de arranque del torno:\n\n- [ ] Inducción firmada y adulto presente.\n- [ ] Lentes puestos, cabello recogido, sin guantes ni joyas.\n- [ ] Pieza apretada en el mandril, saliente ≤3× el diámetro (o contrapunto).\n- [ ] Llave del mandril fuera y guardada.\n- [ ] Herramienta a la altura del centro y bien apretada.\n- [ ] Gira la pieza a mano una vuelta: nada choca.\n- [ ] Inserto correcto para aluminio y sin filo roto.\n- [ ] Avance y profundidad de partida definidos con el adulto.\n- [ ] Lubricante listo; sin trapos ni herramientas sobre la bancada.\n- [ ] Sabes dónde está el paro de emergencia.\n\n### Router CNC\n\n| Criterio | Detalle |\n|---|---|\n| Para qué sí | Madera, MDF, plásticos (acrílico, policarbonato con cuidado), piezas planas con contornos |\n| Para qué no | Aluminio sin fresa y velocidad adecuadas; trabajo sin cubierta de polvo; corte sin sujetar la lámina |\n| Precisión esperada | Depende de la máquina; mídela con una pieza de prueba antes de cortar la pieza final |\n| Riesgos y EPP | Fresa de alta velocidad; polvo fino; plástico que se derrite y se re-solidifica; pieza que se mueve; lentes y mascarilla para polvo |\n| Quién puede usarla | Alumno con inducción; adulto presente y revisando el programa antes de correr |\n\n- **[Buena práctica]** Revisa el origen (zero) y el programa antes de iniciar. Haz una corrida en el aire (sin material) para ver los movimientos.\n- Usa el paro de emergencia si algo se ve mal. Mantén la vista sobre la máquina.\n- Sujeta la lámina con sujetadores que no estén en la trayectoria de la fresa.\n\n## Fabricación digital: impresora 3D y láser\n\n- **Impresora 3D** y **láser** no se describen aquí en detalle. Las reglas de diseño para piezas impresas y cortadas están en **`manufactura.md`** (guía de manufactura de este mismo directorio).\n- **Láser:** siempre con un adulto presente. Las reglas de materiales prohibidos aplican; **PVC y vinilo no se cortan en láser** (libera cloro y ácido clorhídrico). El policarbonato es riesgo de fuego y gases. Identifica el material por su hoja de datos o su SDS antes de cortar; \"acrílico\" y \"vinilo\" a veces son PVC.\n- **Impresora 3D:** ventila el área, no toques la boquilla ni la cama caliente, y usa el gabinete cerrado si imprimes ABS u otros materiales con olor.\n\n## Herramientas de medición\n\nMedir antes y después de cada operación. Una medida mala se nota en el ensamble, no en el taller.\n\n| Herramienta | Para qué sí | Precisión típica | Cómo se usa |\n|---|---|---|---|\n| **Calibrador (vernier o digital)** | Medir diámetros, espesores, profundidades | 0.001\" (digital o vernier de precisión) | Limpia las quijadas, cierra el calibrador, pon el cero. Mide con las quijadas paralelas a la pieza y sin apretar en exceso |\n| **Escuadra (square)** | Revisar perpendicularidad y poner piezas a 90° | Depende de la escuadra; revisa con una escuadra de referencia | Apoya la base contra el borde de referencia y mira la luz entre la pieza y la hoja |\n| **Regla de acero** | Medir largos y marcar | 1/64\" o 0.5 mm | Apoya el canto de la regla sobre la pieza; mide desde el canto, no desde el extremo gastado |\n| **Centro de punta (center punch)** | Marcar puntos de partida | No es de medida; marca el centro | Ver sección de punto de centro |\n| **Micrómetro** | Medir espesor y diámetro con más precisión | 0.001\" o 0.0001\" según el modelo | Gira el tambor hasta que sientas el trinquete; no apretes con fuerza. Limpia las caras antes de medir |\n\n**Cómo medir bien (buena práctica):**\n- Mide a la temperatura del taller (no inmediatamente después de cortar o soldar; el material se dilata).\n- Mide siempre en el mismo lugar y en la misma orientación.\n- Revisa el cero antes de cada uso.\n- Anota la medida en el dibujo o en la hoja de trabajo.\n- Si la medida no coincide con el dibujo, detente y revisa el dibujo, no la pieza.\n\n## Herramientas de electrónica (remite a electronica.md)\n\nLas reglas de cableado, conectores, fusibles y baterías están en **`electronica.md`**. Aquí solo se describen las herramientas de taller.\n\n- **Pelacables (wire strippers):** quita el aislamiento sin dañar el cobre. Ajusta a la medida del cable. Un corte en el cobre reduce la corriente que aguanta.\n- **Crimpadora:** une el terminal al cable con la herramienta del terminal correcto. Un crimp malo se suelta bajo vibración. Revisa el crimp con un tirón firme antes de usarlo.\n- **Multímetro:** mide voltaje, corriente y resistencia. Revisa que la punta esté en el puerto correcto. Nunca midas corriente en paralelo con la fuente. Verifica con voltaje conocido antes de medir.\n- **Cautín:** sirve para soldar. Riesgo de quemadura; deja la punta en el soporte cuando no la uses; ventila el humo de soldadura (flux).\n\nQuién puede usarlas: alumno con inducción; adulto presente cuando hay corriente o cuando se suelda.\n\n## Reglas de seguridad del taller\n\n### Equipo de protección personal (EPP)\n\n- **Lentes de seguridad** (ANSI Z87.1 o equivalente) **siempre** en el taller, no solo en la máquina. Lentes con protección lateral. [Buena práctica] Política del equipo; la sección 8 del manual 2026 no define el EPP del taller.\n- **Careta (face shield)** adicional en esmeril, Dremel, ingletadora y cualquier máquina con viruta que salga a alta velocidad.\n- **Protección auditiva** cuando el ruido es de 85 dB o más, por tiempo prolongado. Ej.: ingletadora, esmeril, router, compresor. [Buena práctica]\n- **Mascarilla para polvo** (N95 o mejor) al lijar, cortar MDF, madera, fibra o plástico. Para vapores de soldadura o plásticos quemados, usa respirador con cartucho.\n- **Zapatos cerrados** siempre.\n\n### Ropa, cabello y joyas\n\n- Cabello largo recogido y bajo gorra o red.\n- Sin joyas: anillos, pulseras, collares, relojes.\n- Sin ropa suelta: camisas amarradas, sin corbata, sin bufanda, sin cordones colgando.\n- **Guantes NO en máquinas rotativas.** [Buena práctica] Un guante puede atorarse en el husillo, la broca o el disco y jalar la mano hacia la máquina. OSHA recomienda no usar guantes con taladros de banco ni con maquinaria con partes rotativas accesibles (ver Fuentes). Los guantes de trabajo solo se usan al manipular lámina o rebabas fuera de la máquina, nunca con la máquina girando.\n\n### Sujeción y manejo de piezas\n\n- Nunca sostengas una pieza con la mano mientras la máquina corta, taladra o gira.\n- Usa prensa, abrazadera, tornillo de banco o tope para piezas pequeñas.\n- Empuja la pieza con empujador (push stick) cuando estés cerca de la hoja.\n- Pieza larga sin soporte: pon un soporte de salida (roller stand) para que no se caiga.\n\n### Orden y limpieza\n\n- Piso libre de cables, retales y viruta.\n- Herramientas en su lugar al terminar. Una llave del mandril o una llave de tuerca olvidada en la máquina es un accidente.\n- Virutas: limpia con cepillo o gancho, **nunca con la mano** (la viruta corta y puede estar caliente). Nunca sopletees la viruta con aire hacia la cara.\n- Derrames de aceite o taladrina: límpialos al momento. Un piso mojado es riesgo de caída.\n- Limpia el polvo al terminar; el polvo de madera, MDF y plástico se acumula y es combustible en algunos casos.\n\n### Paro de emergencia y extintor\n\n- Sabe dónde está el paro de emergencia de cada máquina. Presiónalo con el puño o el codo, no con la mano abierta.\n- Ten el extintor a la vista y sabe usarlo: **PASE** (Pull el pin, Apunta a la base del fuego, Aprieta la palanca, Barre de lado a lado). [Buena práctica]\n- Extintor tipo ABC para uso general en el taller. Revisa la fecha y la presión.\n- Nunca uses agua en fuego eléctrico. Desconecta primero la corriente.\n- Si hay químicos en el taller, debe haber lavaojos y una hoja de datos de seguridad (SDS).\n\n### Máquinas: guardas\n\n- [Buena práctica] Las guardas se usan siempre. No se quitan ni se desactivan para trabajar más rápido.\n- Si una guarda está dañada o se mueve mal, deja de usar la máquina, avisa al adulto y bloquéala (lockout) hasta que esté arreglada.\n- [Buena práctica] Un adulto revisa las guardas al inicio de cada sesión.\n\n### Vestimenta y comportamiento\n\n- No corras en el taller.\n- No uses audífonos ni te pongas a platicar mientras operas una máquina.\n- No trabajes cansado ni bajo efecto de sustancias.\n- Si estás enfermo o te sientes mareado, avisa y detente.\n\n## Mantenimiento básico\n\nLista rápida por herramienta. Quién hace el mantenimiento: alumno con inducción y adulto revisa.\n\n| Herramienta | Revisar cada uso | Revisar cada semana / mes |\n|---|---|---|\n| Taladro de banco | Mesa limpia, tope y prensa apretados, broca afilada | Lubricar la columna con aceite ligero; revisar la banda y su tensión; ajustar la base |\n| Taladro de mano | Batería cargada, broca apretada en el mandril | Limpiar el mandril; revisar el cable y la clavija |\n| Sierra cinta | Hoja tensa y guías ajustadas | Revisar el desgaste de la hoja; limpiar las ruedas; lubricar según manual |\n| Ingletadora | Guarda inferior libre; disco sin grietas | Revisar el disco; ajustar el tope; lubricar pivote |\n| Esmeril | Disco sin grietas; apoyo a 1/8\" del disco | Revisar el desgaste del disco; revisar la tuerca y la fijación |\n| Dremel | Disco y boquilla (collet) sin desgaste | Limpiar las boquillas; revisar el cable |\n| Lijadora de banda | Banda sin desgarres; dirección correcta | Limpiar el polvo del motor y de la banda |\n| Machuelos y terrajas | Sin rebabas ni dientes rotos | Limpiar; aceitar; guardar en su estuche |\n| Remachadora POP | Mandíbulas limpias | Lubricar el mecanismo; revisar el mandril |\n| Dobladora | Dados sin rebabas o marcas | Revisar la alineación; lubricar los pivotes |\n| Fresadora / torno | Viruta retirada; mandril y llave en su lugar | Lubricar guías; revisar juego de husillo; calibrar dial |\n| Router CNC | Fresa afilada y bien apretada; aspirador funcionando | Limpiar las guías; revisar la correa o el husillo |\n| Impresora 3D | Boquilla sin obstrucción; cama nivelada | Limpiar la boquilla; revisar la correa; revisar el ventilador |\n\n[Fabricante] Confirma los intervalos con el manual de cada máquina.\n\n## Errores comunes\n\n- **Usar la broca sin punto de centro.** La broca patina y el agujero queda fuera de lugar.\n- **Taladrar sin sujetar la pieza.** Gira, se atora y sale volando.\n- **Usar disco abrasivo en aluminio.** Se carga de metal y puede rebotar.\n- **Dejar la llave del mandril puesta.** Sale disparada al encender.\n- **Remachar acero inoxidable con remache de aluminio.** Se corroe.\n- **Machuelo con broca equivocada.** La rosca queda floja o el machuelo se rompe.\n- **Doblar lámina sin revisar el radio mínimo.** La lámina se agrieta.\n- **Medir con el calibrador sin cero.** Todas las medidas salen mal.\n- **Medir pieza recién cortada o caliente.** La medida cambia al enfriar.\n- **Usar guantes en el taladro de banco.** El guante se atora y jala la mano.\n- **Sacar la viruta con la mano.** Corta o quema.\n- **Quitar o desactivar la guarda.** Es un riesgo grave para ti y para tus compañeros.\n- **Dejar la broca desafilada.** Quema el material, se atora y gasta la máquina.\n- **Usar el taladro de mano para hacer agujeros perpendiculares sin guía.** Quedan torcidos.\n- **Presionar el rodamiento por la pista equivocada.** Daña el rodamiento.\n\n## Checklist de inducción por herramienta\n\nCada casilla se marca cuando el adulto revisa que el alumno lo hace bien. Sin checklist firmado, no se usa la herramienta.\n\n### Taladrado\n\n- [ ] Taladro de mano: sostener, arranque suave, usar guía para perpendicular.\n- [ ] Taladro de banco: apagar y encender, tope de profundidad, prensa, punto de centro, velocidad, picoteo, lubricante.\n- [ ] Brocas: identificar HSS, cobalto, escalonada y carburo; afilar o cambiar una broca desafilada.\n- [ ] Agujero para rodamiento: prueba de ajuste en pieza de prueba; presión por la pista correcta.\n\n### Roscado\n\n- [ ] Elegir broca de roscado con tabla del fabricante; revisar el paso.\n- [ ] Machuelo: perpendicular, avanzar y retroceder, aceite de corte.\n- [ ] Terraja: preparar la barra, avanzar recto.\n\n### Corte\n\n- [ ] Sierra cinta vertical: tensión, guía, empujador, parar y soltar.\n- [ ] Sierra cinta horizontal: sujetar la barra, hoja correcta, guardas.\n- [ ] Ingletadora: disco no ferroso, guarda inferior, lubricante para aluminio, no sujetar con la mano.\n- [ ] Segueta: hoja correcta, carrera de empuje, sujeción.\n- [ ] Cortatubos: girar, avanzar, quitar rebaba.\n\n### Esmerilado y acabado\n\n- [ ] Esmeril: apoyo a 1/8\", careta, revisar disco, no usar el lado del disco de corte.\n- [ ] Dremel: disco delgado, boquilla, careta, sujetar pieza.\n- [ ] Lijadora de banda: dirección de la banda, sujeción, polvo.\n- [ ] Limas: mango puesto, desbarbado, chaflán.\n\n### Remachado y unión\n\n- [ ] Remachadora POP: rango de agarre, diámetro de herramienta y remache, agujero correcto.\n- [ ] Remachadora neumática: presión de aire, mangueras, nunca apuntar aire a personas.\n- [ ] Prensa de husillo: alineación, dado, presión por la pista correcta, no martillar.\n\n### Formado\n\n- [ ] Dobladora: radio mínimo, dirección del grano, dedos fuera del área de dado, desarrollo calculado.\n\n### Máquinas de mayor riesgo (solo con formación formal)\n\n- [ ] Fresadora: sujeción, velocidad, fresa correcta, viruta, paro.\n- [ ] Torno: llave del mandril, velocidad, viruta, medida con máquina parada.\n- [ ] Router CNC: origen (zero), corrida en el aire, sujeción de lámina, polvo, paro.\n\n### Fabricación digital (remite a manufactura.md)\n\n- [ ] Impresora 3D: ventilación, boquilla, cama caliente, retirar pieza.\n- [ ] Láser: identificar material, prohibidos (PVC, vinilo, policarbonato), extintor listo, nunca desatendido.\n\n### Medición\n\n- [ ] Calibrador: limpiar quijadas, cero, medir sin apretar.\n- [ ] Escuadra: referencia limpia, luz entre pieza y hoja.\n- [ ] Micrómetro: cero, sin apretar en exceso, limpiar caras.\n- [ ] Regla y centro de punta: medir desde el canto; marcar antes de taladrar.\n\n### Electrónica (remite a electronica.md)\n\n- [ ] Pelacables: ajuste al cable, sin dañar el cobre.\n- [ ] Crimpadora: terminal correcto, prueba de tirón.\n- [ ] Multímetro: puerto correcto, voltaje conocido para verificar, nunca medir corriente en paralelo.\n- [ ] Cautín: soporte, ventilación, quemaduras.\n\n## Checklist final antes de usar el taller\n\n- [ ] Inducción firmada para la herramienta.\n- [ ] Adulto presente.\n- [ ] Lentes puestos; careta si aplica; protección auditiva si aplica; mascarilla si hay polvo.\n- [ ] Cabello recogido; sin joyas; sin ropa suelta; zapatos cerrados.\n- [ ] Sin guantes en la máquina.\n- [ ] Pieza sujeta; piso libre; herramientas retiradas.\n- [ ] Guardas en su lugar y funcionando.\n- [ ] Paro de emergencia localizado; extintor a la vista.\n- [ ] Velocidad y broca o disco correctos para el material.\n- [ ] Pieza de prueba hecha si la tolerancia es crítica.\n- [ ] Medida revisada contra el dibujo antes de seguir.\n\n## Fuentes\n\nFuentes consultadas. Las fuentes de tablas de brocas, velocidades y rebabas son de referencia; confirma los valores con el fabricante.\n\n- Velocidades y avance (drill press): https://www.webpages.uidaho.edu/Mindworks/Machine_Shop/Speeds_and_Feeds/RPM_Chart.pdf\n- Taladro de banco (módulo de máquinas): https://www.mie.utoronto.ca/wp-content/uploads/2016/10/MODULE-1-The-Drill-Press.pdf\n- Velocidades de corte y RPM (curso): https://www.wisc-online.com/LearningContent/mtl8202/MLT8202.htm\n- Trabajo con taladro de banco, guardas y gloves (OSHA, entrenamiento): https://www.osha.gov/sites/default/files/2021-04/Drill%20Press%20-%20Trainer%20Script.pdf\n- Guantes en maquinaria con partes rotativas (alerta de seguridad, Massachusetts): https://www.mass.gov/doc/remove-your-gloves-when-using-machinery-with-accessible-rotating-or-moving-parts/download\n- Protección de manos (Safety & Health Magazine): https://safetyandhealthmagazine.com/articles/11182-hand-protection\n- Tabla de brocas y machuelos (Drill America vía Zoro): https://www.zoro.com/resourcehub/tap-and-drill-bit-sizes-a-reference-guide-from-drill-america\n- Tabla de brocas de roscado (Penn Medesign): https://medesign.seas.upenn.edu/index.php/Guides.TapDrillChart\n- Corte de aluminio en sierra (Popular Woodworking): https://www.popularwoodworking.com/techniques/q-sawing-aluminum\n- Manual de seguridad de equipo FRC 2135 (eye protection y ruido): https://frc2135.org/docs/2025-26_FRC2135_Safety_Manual.pdf\n- Manual de seguridad de equipo FRC 2468: https://frc2468.squarespace.com/s/Final-Safety-Manual.pdf\n- Reglas de guardas en máquinas (Carleton College): https://www.carleton.edu/machine-safety/rules/\n- Guardas y seguridad en talleres (CSU Pueblo, SOP EHS-031): https://www.csupueblo.edu/facilities-management/_doc/ehs-031-shop-safety-sop.pdf\n- Protección de máquinas (Univ. de Delaware, C-06): https://www1.udel.edu/ehs/policy/downloads/C-06%20Machine%20Guarding%20and%20Machine%20Shop%20Safety.pdf\n- Guía de seguridad FRC (Stateline Robotics): https://sites.google.com/view/stateline-robotics-4655/more/safety\n- Remachado POP, rango de agarre (Albany County Fasteners): https://www.albanycountyfasteners.com/item/Pop-Rivets-1-8-Multi-Grip-Aluminum\n- Prensa de husillo y rodamientos (Chief Delphi, \"press fit\"): https://www.chiefdelphi.com/t/press-fit/115470\n- Agujeros de precisión con taladro (Chief Delphi, \"Precision hole drilling?\"): https://www.chiefdelphi.com/t/precision-hole-drilling/364400\n- Agujero hex y hub de FRC (AndyMark, \"what is the bore\"): https://andymark.com/pages/what-is-the-bore\n- Cojinetes planos: tolerancias de alojamiento y prensado (igus; referencia para bujes, no para rodamientos de bolas): https://www.igus.eu/plain-bearing/wiki/tolerances\n- Materiales prohibidos en láser: PVC y plásticos clorados (Stanford EHS): https://ehs.stanford.edu/wp-content/uploads/Laser-Cutters-Safety-Guidance.pdf\n- Materiales de láser, riesgo alto de policarbonato (UVic): https://uvic.ca/ohse/assets/docs/radiation/laser-cutter-materials.pdf\n- Radio mínimo de doblez (Durma Press, guía de radios): https://www.durmapress.com/minimum-bend-radius-for-sheet-metal-chart-formula-design-guide\n- Radio mínimo vs. radio recomendado (The Fabricator): https://www.thefabricator.com/article/bending/minimum-versus-recommended-inside-bend-radius\n- Corte y taladro de policarbonato (foro, anecdótico): https://sawmillcreek.org/goto/post?id=1252282\n"},{"id":"electronica","title":"Electrónica y cableado FRC","md":"# Electrónica y cableado FRC\n\nGuía para diseñar, cablear y preparar para inspección la electrónica de un robot FRC del equipo Panteras 2283.\n\n> **Manual vigente: FRC 2026.** Las reglas [FIRST] citan el manual 2026; al salir el de 2027 (9 ene 2027) se actualizan y solo cuenta el vigente. Detalle completo en reglas-frc.md.\n\n**Tipos de regla usados:** **[FIRST]** = requisito del manual. **[Fabricante]** = recomendación de REV/CTR/WPILib. **[Buena práctica]** = práctica común de equipos.\n\n**Seguridad primero.**\n- Una batería FRC puede entregar cientos de amperes: un corto con una herramienta o con un cable pelado causa quemaduras, chispas y fuego. **Todo trabajo de cableado con batería conectada o de soldadura requiere supervisión de un mentor adulto.**\n- Cableado normal: **batería desconectada** (SB50 separado) y breaker principal abierto.\n- Usa lentes de seguridad al crimpar, cortar y soldar. La soldadura requiere ventilación y adulto presente.\n- El robot se prueba **sobre bloques** (ruedas en el aire) la primera vez que se energiza.\n\n---\n\n## 1. Arquitectura del sistema de control (reglas 2026)\n\n```\nBatería 12V (SB50) ──► Main breaker 120A ──► PDH / PDP ──┬─► breakers 40A/30A/20A ──► controladores de motor ──► motores\n                                                          ├─► fusible/breaker ──► roboRIO 2\n                                                          ├─► fusible/breaker ──► radio VH-109 (y/o PoE)\n                                                          ├─► RSL (Robot Signal Light)\n                                                          └─► sensores / CANivore / Pigeon / luces (10A o menos)\nroboRIO ◄─Ethernet─► Radio (puerto RIO) ◄─ WiFi ─► Driver Station\nroboRIO ──CAN (amarillo/verde)──► dispositivo 1 ─► dispositivo 2 ─► ... ─► PDH/PDP (terminación)\n```\n\n| Componente | Qué hace | Notas |\n|---|---|---|\n| Batería | 12V, **17-18.2 Ah**, única, sujeta dentro del robot, ventilación libre **[FIRST]** (R601, R606 2026; R605: ninguna otra batería a bordo) | Todas sus conexiones aisladas siempre **[FIRST]** (R607 2026) |\n| Main breaker 120A | Un solo interruptor entre batería y PD, **rápido y seguro de accionar** **[FIRST]** (R612 2026) | Sirve como \"apagado de emergencia\" |\n| PD (PDH de REV o PDP de CTR) | Única, con breakers y cableado **fácilmente visibles** **[FIRST]** (R613 2026) | El PDH tiene canales con breaker (ATO/Mini) y canales con fusible (20-22 sin switch) |\n| roboRIO 2 | Computadora del robot | Alimentación **directa** de terminales del PD con **fusible/breaker de 10A**, sin otra carga en ese circuito **[FIRST]** (R615 2026) |\n| Radio Vivid Hosting VH-109 (WCP-1538) | Único radio autorizado, con LEDs visibles al personal del campo **[FIRST]** (R702, R708 2026) | Ver sección de radio |\n| RSL (luz de señal) | Máx. 2, visible a 36 in (91 cm) desde al menos un lado, conectada al puerto RSL del roboRIO **[FIRST]** (R709 2026) | Si la frame la tapa, muévela a un lugar visible |\n\n### Radio VH-109: alimentación y red\n- **[FIRST]** (R616, R617 2026) Alimentación por inyector pasivo/cable modificado en el puerto **RIO** del radio y/o directo al **conector de 12V** desde el PD. El circuito del PD debe tener fusible/breaker de **10A** y ninguna otra carga.\n- **[FIRST]** El roboRIO se conecta al puerto **RIO** del radio (VH-109 v1.5, sticker holográfico azul). Con VH-109 v1.0: por inyector PoE, cable Ethernet modificado, o puerto **AUX 1/2** con el DIP switch apagado (R703 2026).\n- **[Fabricante]** WPILib recomienda alimentar el radio **por dos vías** (12V directo + PoE) para redundancia: si un cable se daña, el radio no se apaga.\n- **[Fabricante]** El adaptador PoE de Vivid está cableado al revés que el de REV; **no sustituyas uno por otro** ni conectes el cable PoE pasivo de REV directo al roboRIO.\n- **[Fabricante]** Usa ferrules en los cables rojo y negro del adaptador PoE en las terminales del PDH. Alimenta el radio desde un canal fusible no conmutable (20-22) con fusible de 10A.\n- **[Buena práctica]** Montaje con aislamiento de vibración (espuma, soportes flexibles). Los LEDs del radio deben verse desde fuera del robot.\n- **[FIRST]** (R626 2026) La salida PoE del VH-109 solo puede alimentar un dispositivo COTS de \u003c= 2 A a 12 V, con cable Cat5e/6/7/8 estándar, estando el VH-109 alimentado por las terminales de 12 V con cable 18 AWG o mayor.\n\n### Nota sobre VRM y puertos de radio\nEl **VRM** (módulo de regulación de voltaje) del sistema anterior (roboRIO 1 + radio OM5P) solo se usa en 2026 con radios OM5P (eventos en China, R616-B); con el VH-109 el radio se alimenta con 12V directo o inyector pasivo (R616-A). Si ves un VRM en robots viejos del taller, no lo copies sin confirmar su legalidad.\n\n### SystemCore (sistema de control 2027)\n- **Qué sabemos (fuentes WPILib):** WPILib describe el cambio del roboRIO a **Systemcore** como \"la mayor actualización del sistema de control desde el cRIO\". El hardware es el **Limelight Systemcore**, basado en Raspberry Pi Compute Module 5 (CM5), CPU ARM Cortex-A76 de 4 núcleos, con CAN, I2C, USB y Ethernet, E/S reconfigurable (PWM, DIO, analógica), pantalla, LEDs e IMU integrada. Soporta varios buses CAN.\n- **WPILib 2027** deja de correr en el roboRIO; se eliminan relay, salida analógica y SPI; **Talon y VictorSP no serán legales en 2027**.\n- **Alimentación (repositorio de pruebas de WPILib, alfa):** cable **18 AWG** con ferrules blancos Weidmuller; **no usar a la vez** las dos entradas de energía (Bridge y Weidmuller).\n- **Lo que NO está confirmado:** fecha y forma exacta de distribución (un foro dice que habrá uno en el Kit of Parts, **sin confirmación oficial**), radio, fusible requerido, reglas de montaje y puertos. **Espera al Manual 2027 y a la documentación de WPILib 2027** antes de diseñar el panel definitivo.\n- **[Buena práctica]** Diseña el panel dejando espacio extra para cambiar el controlador (aprox. 2 in de margen alrededor del roboRIO) y no pegues nada permanente que impida moverlo.\n\n---\n\n## 2. Calibres de cable mínimos\n\n**[FIRST]** (R610, R621, R622 2026): cada circuito sale de un solo breaker/fusible del PD y el cable mínimo depende de la protección (Tabla 8-4):\n\n| Circuito | Protección | Calibre mínimo | Fuente |\n|---|---|---|---|\n| Batería - main breaker - PD | Main breaker 120A | **6 AWG** (16 mm²) | R609 2026 |\n| Motores de alta corriente (31-40A) | Breaker **40A** | **12 AWG** (4 mm²) | R621/R622 |\n| Circuitos medios (21-30A) | Breaker **30A** | **14 AWG** (2.5 mm²) | R621/R622 |\n| Circuitos de 6-20A (o fusible de 11-20A) | Breaker **20A** | **18 AWG** (1 mm²) | R622 |\n| Breaker \u003c= 5A o fusible \u003c= 10A | Fusible/breaker pequeño | **22 AWG** (0.5 mm²) | R622 |\n| Salidas PWM del roboRIO / circuito con fusible \u003c= 1A | n/a | **26 AWG** | R622 |\n| Circuitos de señal (\u003c= 1A continuo, p. ej. CAN, solenoides PCM/PH) | n/a | **28 AWG** | R622 |\n| CAN (práctica) | n/a | 22 AWG torcido (estándar WPILib; el mínimo legal para señal es 28 AWG) | [Fabricante] |\n\n- **[Buena práctica]** Equipos usan **10 AWG** para motores de 40A para menos caída de voltaje y 4 AWG para la batería (legal ya que 6 AWG es el mínimo). Más grueso es siempre legal; más delgado nunca.\n- **[Buena práctica]** Wiki de equipos (3255): 18 AWG para roboRIO/radio y 22 AWG para sensores pequeños con fusible de 10A. La Tabla 8-4 (R622) solo exige 22 AWG para \u003c= 10A de fusible y 18 AWG para 11-20A; los cables que vienen con un dispositivo legal están exentos si usan el fusible más pequeño que permita operarlo.\n- **[FIRST]** (R622 2026) Solo cobre aislado o aluminio revestido de cobre (CCA, se considera cobre); los cables de nivel de señal no tienen que ser de cobre.\n- **[FIRST]** (R618 2026) **Solo 1 cable por terminal del PD.** Para repartir potencia, empalma los cables (bloque de terminales, crimp o soldadura) y mete un solo cable principal a la terminal. Todo el camino eléctrico (empalmes y conectores incluidos) debe estar dimensionado para el circuito (R623).\n- **[Buena práctica]** Un cable por terminal también en los WAGO 221 (recomendación de uso del fabricante).\n- **[Buena práctica]** Si en un conector entran varios cables, súmalos: el calibre efectivo baja alrededor de 3 AWG por cada duplicación del área. Dos cables de 18 AWG equivalen aproximadamente a 15 AWG (wiki 3255).\n\n## 3. Colores de cable\n\n| Uso | Color | Tipo |\n|---|---|---|\n| Potencia positiva (+24, +12, +5 V) | **Rojo, amarillo, blanco, café, o negro con raya** (de fábrica, en toda su longitud) | **[FIRST]** (R624 2026) |\n| Potencia común (negativo) | **Negro o azul** | **[FIRST]** (R624 2026) |\n| CAN High | **Amarillo** | [Fabricante] |\n| CAN Low | **Verde** | [Fabricante] |\n| Motor (controlador con cables blanco/verde) | rojo a blanco, negro a verde | [Fabricante] |\n| PWM | negro hacia afuera del roboRIO | [Fabricante] |\n\n- **[FIRST]** (R624-C/D) Se exceptúan los cables originales de dispositivos legales (y sus extensiones del mismo color) y el Ethernet de los cables PoE. Las salidas de controladores, relés y sensores y el cableado de señal tampoco se rigen por esta regla.\n- **[Buena práctica]** Usa **rojo = +** y **negro = −** siempre; evita azul/amarillo en potencia para que nadie confunda CAN con potencia.\n- **[Buena práctica]** Etiqueta ambos extremos con banderas (FROM / TO) y mantén una hoja de canales del PD.\n\n---\n\n## 4. Bus CAN\n\n- **Topología:** cadena o **daisy chain**: roboRIO, luego cada dispositivo, y al final el PDH/PDP. **[Fabricante]** (WPILib). Sin estrellas ni ramas largas.\n- **Terminación 120 Ω:** el roboRIO y el PDP/PDH ya traen terminadores. Deja los dispositivos **entre** roboRIO y PD. Si el PD queda a mitad del bus, apaga su terminación (switch TERM/jumper en OFF) y pon una resistencia de 120 Ω al final. **[Fabricante]**\n- **Cable:** par torcido, **amarillo = CAN High**, **verde = CAN Low**. Si el cable es de 4 conductores, el blanco cuenta como amarillo (wiki 3255). **[Buena práctica]**\n- **Cable de retención:** los cables preterminados (SPARK MAX) deben llevar su clip de retención; si no hay, cinta o zip tie. **[Fabricante]**\n- **IDs:** cada dispositivo del mismo tipo necesita un **ID único** (por defecto es 0). Asigna por rangos y documéntalos. **[Buena práctica]**\n\n| Rango sugerido de ID | Uso |\n|---|---|\n| 1-4 | Tracción (drive), orden fijo |\n| 5-8 | Dirección (steer) swerve |\n| 9-12 | CANcoders / encoders absolutos |\n| 13+ | Mecanismos (intake, shooter, elevador...) |\n| 20+ | Sensores (Pigeon, CANdle) |\n\n- **Heartbeat:** el roboRIO manda un heartbeat cada 20 ms; si pasan 100 ms sin él, los dispositivos se deshabilitan (WPILib). Un bus CAN malo puede deshabilitar el robot.\n- **CAN FD / CANivore:** el CANivore de CTR es un adaptador USB a **CAN FD** con terminación de 120 Ω seleccionable por software. Solo dispositivos compatibles con CAN FD (p. ej. Talon FX/Kraken) aprovechan CAN FD. Práctica común: dispositivos de la tracción y Pigeon en el bus CANivore, el resto en el bus del controlador. **[Fabricante / Buena práctica]**\n- **SystemCore:** tendrá varios buses CAN integrados; verifica si el CANivore sigue siendo necesario o legal en 2027.\n- **[Buena práctica]** Revisa la utilización del bus en el Driver Station y en Phoenix Tuner / REV Hardware Client; mucha utilización provoca lag y timeouts.\n\n---\n\n## 5. Conectores y herramientas\n\n| Conector | Uso | Reglas y consejos |\n|---|---|---|\n| **Anderson SB50** | Batería - robot | Estándar del manual. Sujeta con clip o zip tie. Conecta la batería al lado del robot **al final** **[Fabricante]** |\n| **Anderson Powerpole** | Cargadores, extensiones pequeñas | Crimpa con la herramienta correcta, no con pinzas |\n| **WAGO 221** (palanca) | Motores y sensores | **1 cable por terminal** **[Buena práctica]**. Pela ~11-12 mm (confirma en el empaque), **no estañes** el cable, levanta la palanca, inserta completo y verifica por la ventana |\n| **WAGO del PDH/PDP** | Canales del PD | Acepta cable fino sin ferrule según el modelo; no estañar |\n| **Weidmuller** (roboRIO, radio, SystemCore) | Alimentación de controladores | Acepta 16-24 AWG; pela ~8 mm (5/16\"); usa **ferrule** |\n| **Ferrules** | Cable multifilar en terminales de tornillo/resorte | Crimpado cuadrado; el hilo sobresale poco del ferrule |\n| **Terminal de ojo (lug)** | Cable 6 AWG a main breaker/PD | Crimpadora de 6 AWG, tirón de prueba |\n\n- **Crimpado correcto [Buena práctica]:** (1) pela la longitud exacta, (2) sin hilos sueltos (\"whiskers\"), (3) herramienta del tamaño correcto, (4) **tira del cable con la mano** para probar, (5) revisa visualmente. Un crimpado malo es la causa No. 1 de fallas intermitentes.\n- **Soldadura [Buena práctica]:** solo con adulto y ventilación. Usa **termofil** (heat shrink con adhesivo) sobre toda la unión. No sueldes cables que van a recibir flexión repetida; los cables soldados se rompen justo donde acaba la soldadura. Nunca sueldes en un conector WAGO.\n- **Herramientas mínimas:** pelacables de calibres, crimpadora de ferrules, crimpadora para lugs 6 AWG, crimpadora Anderson, pistola de calor, multímetro, probador de continuidad, etiquetadora.\n- **[Fabricante]** Tapa con cinta o funda los dos terminales del main breaker y cualquier terminal expuesta del PDP.\n\n---\n\n## 6. Baterías\n\n- **[FIRST]** Una sola batería 12V de **17-18.2 Ah**, sujeta dentro del robot con ventilación libre sin obstruir (R601, R606 2026), dimensiones nominales 7.1 x 3.0 x 6.6 in (+/-0.1 in), peso 11.0-14.5 lb, terminales de tuerca y perno, y con todas las conexiones aisladas (R607). El manual da ejemplos (Enersys NP18-12, MK ES17-12, Power Sonic PS-12180NB, Yuasa NP18-12B, etc.) y puede pedirse documentación de otros modelos.\n- **[FIRST]** (R603, R604 2026) El cargador debe tener conector Anderson SB y no puede exceder **6 A** de corriente promedio de carga.\n- **Carga [Buena práctica]:** usa un cargador SLA inteligente de 12V; carga a corriente moderada; no cargues en superficies inflamables ni sin vigilancia; guarda cargada, no descargada a fondo.\n- **Rotación [Fabricante]:** rota las baterías uniformemente para que se carguen, descansen y se desgasten igual. Etiqueta cada una con número y fecha (edad).\n- **Prueba con analizador [Fabricante/Buena práctica]:** mide la **resistencia interna** con un analizador de baterías (p. ej. CBA o similar); predice mejor el rendimiento que el voltaje en vacío. Retira las que muestren resistencia alta.\n- **Daños:** una batería **caída** se marca como mala hasta probarla; el daño en celdas puede no verse en el voltaje **[Fabricante]**. Hinchada, con fuga, caliente o con terminales dañadas: **sácala de uso y avisa al mentor**.\n- **Manejo seguro:** nunca cargues la batería por sus cables (daña las conexiones internas). Aisla terminales al guardar. No hagas corto con herramientas. Lleva siempre lentes al manejarlas y no las expongas a calor.\n- **Baterías extra [FIRST]** (R602, R605 2026): solo baterías USB COTS \u003c= 100 Wh (5 V/5 A o 12 V/5 A USB-PD) o integradas a computadoras/cámaras COTS, bien sujetas y con cables COTS sin modificar. Ninguna otra batería a bordo, ni como lastre.\n\n---\n\n## 7. Breakers y fusibles\n\n- **[FIRST]** (R619 2026) Solo se permiten estos breakers en el PD: Snap Action VB3-A o AT2-A, MX5-A o MX5-L, REV ATO y CTR ATO (todos de 40A o menos), y cualquier ATM de valor \u003c= a los fusibles permitidos por R620.\n- **[FIRST]** (R620 2026) Fusibles de lámina: ATC/ATO \u003c= 10A en cualquier PD; en el PDP, ATM con el valor impreso en su portafusible; en el PDH, ATM \u003c= 15A y un solo fusible de 20A para PCM/PH.\n- **[FIRST]** (R621 2026, Tabla 8-3) Un solo breaker/fusible por circuito: controlador de motor hasta 40A (1 por breaker), circuito personalizado hasta 40A, PCM/PH con compresor y Servo Hub hasta 20A, relé Automation Direct 12A hasta 10A.\n- **[FIRST]** El PD, sus breakers y su cableado deben verse fácilmente para inspección (R613).\n- **[Fabricante]** Asienta bien cada fusible: uno bien colocado es difícil de sacar con la mano.\n- **[Buena práctica]** Usa breaker de 40A para motores grandes (Kraken/NEO/Falcon), 30A para NEO 550 o mecanismos medianos, y mantén los 20A y menos para actuadores pequeños. Un breaker que se dispara es información: revisa el mecanismo (atoramiento) antes de subir el calibre.\n\n---\n\n## 8. Aislamiento del chasis\n\n- **[FIRST]** (R611 2026) La frame debe estar **eléctricamente aislada**: **> 120 Ω** entre el poste (+) o (−) del conector APP del PD y cualquier punto del robot.\n- **Prueba:** con el robot apagado, mide con multímetro en ohms entre el poste (+) y (−) del PD y un punto **sin pintura** de la frame. Ambos deben marcar abierto o > 120 Ω.\n- **[Buena práctica]** Causas comunes de fuga: cable con aislamiento pelado contra una placa, tornillo largo de un motor, terminal de ojo rozando el aluminio, cinta aplastada. Revisa y reencamina.\n- Nunca conectes el negativo de la batería a la frame (ni como \"tierra\").\n\n---\n\n## 9. Diseño de panel (recomendaciones)\n\nEl panel o \"board\" de electrónica se diseña en CAD desde el inicio, no se improvisa.\n\n**Dimensiones [Buena práctica]:** referencia del kitbot: ~24 x 16 in (60 x 40 cm) en material de 1/4\"-1/2\" (6-12 mm). Ajusta a tu chasis.\n\n**Reglas de colocación**\n1. **Acceso:** main breaker accesible rápido y seguro (R612); en el borde del robot, nunca debajo de un mecanismo.\n2. **Visibilidad:** PD y sus breakers visibles de frente (R613); LEDs de estado del radio y RSL visibles desde fuera (R708, R709).\n3. **Orden de flujo:** batería, main breaker, PD, controladores, motores. Los cables de potencia cortos y rectos.\n4. **PD cerca de los controladores:** hacia atrás del robot pero con espacio para cables al roboRIO **[Fabricante]**.\n5. **Separa potencia de señal:** CAN y cables de sensor lejos de los cables de motor de 40A para evitar ruido.\n6. **Controladores de motor cerca de sus motores** cuando sea posible (menos cable de 12 AWG largo, menos caída de voltaje).\n7. **Alivio de tensión:** asegura el cable cerca de cada conector con slack, para que el conector no cargue tensión **[Fabricante]**. No amarres de más: complica el diagnóstico.\n8. **Rutas de cable:** canaletas, ojales o cinta en bordes de aluminio; protege los cables que pasan por láminas **[Fabricante]**. Mantén holgura lejos de cadenas, bandas y mecanismos que giran o se extienden (dibuja la ruta
